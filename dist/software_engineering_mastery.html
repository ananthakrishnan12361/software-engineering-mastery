#### What is this?

**Programming fundamentals** are the core building blocks every software system relies on: how instructions are structured and executed, how data is named and stored in memory (<GlossaryTerm definition="A named binding in a lexical environment that points to a value or memory reference.">variables</GlossaryTerm>), how the runtime interprets raw bits (<GlossaryTerm definition="A classification that tells the runtime how to store a value in memory and which operations are valid on it.">data types</GlossaryTerm>), and how reusable units of logic accept inputs and produce outputs (<GlossaryTerm definition="A reusable, callable block of logic that executes within its own call stack frame.">functions</GlossaryTerm>).

#### Why does it exist & what problem does it solve?

CPUs only understand binary instructions and raw memory addresses. Writing large applications directly in binary or assembly is slow, error-prone, and tied to one hardware architecture. High-level languages such as JavaScript, TypeScript, Python, and Java solve this by giving engineers:

- **Named abstractions (variables)** instead of raw hex memory addresses.
- **Data types** so the runtime knows whether \`01000001\` means the integer \`65\`, the character \`"A"\`, or part of a floating-point decimal.
- **Functions** to decompose complex business workflows into small, named, testable, reusable units with isolated local state.

#### Where is it used in real-world software?

Every layer of production software depends on these primitives. A React UI component is a JavaScript function returning UI descriptions from state variables. A Node.js/Express route handler is a function validating JSON types and transforming data. Even severe production outages—such as billing rounding errors, corrupted 64-bit database IDs in JSON, or authentication bypasses via loose type coercion—usually trace back to misunderstood fundamentals rather than exotic frameworks.

</TopicSection>

<TopicSection id="m01-p1-sec-b" letter="B" title="Fundamentals (Simple Mental Models)">

<TopicAnchor id="m01-p1-topic-fundamentals" />

#### 1. Programming Fundamentals: Expressions, Statements & Control Flow

A program is a sequence of instructions executed top to bottom unless redirected by **control flow**. Two terms cause frequent confusion:

- <GlossaryTerm definition="A unit of code that evaluates to a single value (for example: 2 + 3, user.name, or calculateTax(100)).">Expression</GlossaryTerm>: Anything that produces a value (e.g., \`price * 1.1\`, \`isValid ? "ok" : "err"\`).
- <GlossaryTerm definition="A complete instruction that performs an action (for example: let x = 5;, if (...) {}, or return x;).">Statement</GlossaryTerm>: An instruction that performs an action (e.g., declaring a variable, branching with \`if\`, looping with \`for\`).

To direct execution paths safely, programs combine four control-flow constructs:

- **Conditionals (\`if / else if / else\`, \`switch\`, ternary \`?:\`):** Choose one branch based on a boolean condition. Use \`if/else\` for range or multi-variable checks, \`switch\` (with explicit \`break\` or \`return\` to avoid fall-through bugs) for discrete enum/status codes, and \`?:\` when you need a short inline expression.
- **Loops (\`for\`, \`while\`, \`do...while\`, \`for...of\`):** Repeat work until a stop condition becomes false. Prefer \`for...of\` when iterating arrays/iterables, classic \`for (let i = 0; ...)\` when you need the index, \`while\` when iteration count is unknown upfront, and \`break\` / \`continue\` to exit early or skip an iteration.
- **Early Returns (Guard Clauses):** Validate invalid inputs at the top of a function and \`return\` or \`throw\` immediately instead of nesting deeply inside \`if/else\` pyramids.
- **Exception Flow (\`try / catch / finally\`):** Redirect execution to a \`catch\` handler when an operation throws an \`Error\`, with \`finally\` always running cleanup logic (such as closing locks or timers) whether the block succeeded or failed.

<TopicAnchor id="m01-p1-topic-variables" />

#### 2. Variables: Labels, Not Boxes

Beginners often picture a variable as a physical box holding a value. A more accurate mental model is a **sticky-note label** attached to a slot in memory (for primitives) or pointing to an object in heap memory:

- **Declaration** creates the label in the current scope (e.g., \`let total;\`).
- **Initialization** gives it its initial value (e.g., \`let total = 0;\`).
- **Reassignment** moves the label to point to a different value (\`total = 50;\`).
- \`const\` prevents *reassignment* of the label, **not** mutation of an object's internal properties.

<TopicAnchor id="m01-p1-topic-data-types" />

#### 3. Data Types: The 8 ECMAScript Types

JavaScript is <GlossaryTerm definition="A type discipline where values have types at runtime rather than variables having fixed compile-time types.">dynamically typed</GlossaryTerm>: variables do not have fixed types, **values** do. ECMAScript defines **8 data types**—7 primitives and 1 reference type:

- **Primitives (immutable, stored/copied by value):** \`number\` (64-bit IEEE-754 float), \`bigint\` (arbitrary-precision integers like \`9007199254740993n\`), \`string\` (immutable UTF-16 code units), \`boolean\` (\`true\`/\`false\`), \`undefined\` (declared but unassigned), \`null\` (intentional absence of an object value), \`symbol\` (guaranteed-unique identifier).
- **Reference type (mutable, copied by reference value):** \`object\` (plain objects, arrays, functions, \`Date\`, \`Map\`, \`Set\`, \`RegExp\`).

<TopicAnchor id="m01-p1-topic-functions" />

#### 4. Functions: Inputs, Scope, Return Values & First-Class Citizenship

A function packages behavior under a name (or as an anonymous value), receives inputs via <GlossaryTerm definition="Named placeholder variables listed in a function's definition.">parameters</GlossaryTerm> (filled by <GlossaryTerm definition="Actual values passed by the caller when invoking a function.">arguments</GlossaryTerm>), runs inside a fresh local execution frame, and returns one value (defaulting to \`undefined\` if no \`return\` is executed).

In JavaScript, functions are <GlossaryTerm definition="Values that can be stored in variables, passed as arguments to other functions, and returned from functions.">first-class functions</GlossaryTerm>. That enables <GlossaryTerm definition="A function that accepts another function as an argument or returns a function as its result.">higher-order functions</GlossaryTerm> such as \`Array.prototype.map\`, Express middleware, and React hooks.

</TopicSection>

<TopicSection id="m01-p1-sec-c" letter="C" title="Internal Working & Architecture">

#### 1. How a JS Engine Parses and Executes Code

Modern runtimes like Google V8 (used in Chrome and Node.js) do not simply read text line by line from disk:

1. **Lexing & Parsing:** Source text is split into tokens and parsed into an <GlossaryTerm definition="Abstract Syntax Tree: a tree representation of the syntactic structure of source code.">AST</GlossaryTerm>. Syntax errors are caught here before a single line runs.
2. **Creation / Compilation Phase:** Before executing a scope, the engine creates a *Lexical Environment*, registers bindings (\`var\` initialized to \`undefined\`; \`let\`/\`const\` placed in the <GlossaryTerm definition="Temporal Dead Zone: the period between entering a scope and a let/const declaration executing, during which reading the binding throws a ReferenceError.">TDZ</GlossaryTerm>; function declarations bound to their function object).
3. **Bytecode & JIT Optimization:** V8's *Ignition* interpreter compiles the AST into compact bytecode and executes it. Hot functions (executed frequently with consistent types) are compiled to optimized machine code by *TurboFan* (JIT). If a type assumption breaks later (e.g., passing a string where an integer always arrived), V8 performs a *deoptimization* back to bytecode.

#### 2. Stack vs. Heap Memory & Call Stack Frames

When a function runs, the engine pushes a new **Stack Frame** onto the <GlossaryTerm definition="A LIFO (Last-In, First-Out) memory region tracking active function invocations, local bindings, and return addresses.">Call Stack</GlossaryTerm>. Fixed-size primitive values (and references/pointers to objects) live in the fast, contiguous stack frame (or CPU registers). Dynamic, variable-sized structures like objects, arrays, and closures are allocated on the <GlossaryTerm definition="A large, flexibly managed memory region for dynamic objects whose lifetime may outlive a single function call.">Heap</GlossaryTerm>, and the stack variable holds a reference (pointer) to that heap address.

#### 3. IEEE-754 Double-Precision Floating Point & Tagged Values

Every JavaScript \`number\` uses the **IEEE-754 64-bit binary floating-point** format:

- **1 bit** for Sign (0 = positive, 1 = negative)
- **11 bits** for Exponent
- **52 bits** for Significand/Mantissa (plus 1 implicit leading bit = 53 bits of precision)

Because 53 bits of precision can represent integers exactly only up to \`2^53 - 1\` (\`9,007,199,254,740,991\` = \`Number.MAX_SAFE_INTEGER\`), integers larger than this lose their least significant digits! Furthermore, base-10 fractions like \`0.1\` and \`0.2\` are repeating fractions in base-2 binary (just as \`1/3 = 0.333...\` repeats in base-10), producing tiny rounding residues such as \`0.1 + 0.2 === 0.30000000000000004\`.

*Engine detail (V8):* Internally, V8 optimizes common 31-bit/32-bit signed integers as **Smi (Small Integers)** stored directly inside tagged pointers without heap allocation, while fractional or large numbers become heap-allocated \`HeapNumber\` objects.

#### Example 3: Pass-by-Sharing, Pure Functions & Higher-Order Composition

<CodeBlock
  lang="javascript"
  runnable
  code={\`// Pure function: depends only on inputs, does not mutate arguments
function calculateLineTotalCents(unitPriceCents, quantity, discountRate = 0) {
  if (!Number.isSafeInteger(unitPriceCents) || unitPriceCents < 0) {
    throw new TypeError("unitPriceCents must be a non-negative safe integer");
  }
  if (!Number.isSafeInteger(quantity) || quantity < 0) {
    throw new TypeError("quantity must be a non-negative safe integer");
  }
  if (typeof discountRate !== "number" || !Number.isFinite(discountRate)) {
    throw new TypeError("discountRate must be a finite number");
  }
  if (discountRate < 0 || discountRate > 1) {
    throw new RangeError("discountRate must be between 0 and 1");
  }
  const gross = unitPriceCents * quantity;
  if (!Number.isSafeInteger(gross)) {
    throw new RangeError("Line total exceeds Number.MAX_SAFE_INTEGER");
  }
  const rounded = Math.round(gross * (1 - discountRate));
  return rounded === 0 ? 0 : rounded;
}

// Higher-order function returning a configured validator/calculator
function createTaxCalculator(taxRate) {
  if (typeof taxRate !== "number" || !Number.isFinite(taxRate)) {
    throw new TypeError("taxRate must be a finite number");
  }
  if (taxRate < 0 || taxRate > 1) {
    throw new RangeError("taxRate must be between 0 and 1");
  }
  return function applyTax(subtotalCents) {
    if (!Number.isSafeInteger(subtotalCents) || subtotalCents < 0) {
      throw new TypeError("subtotalCents must be a non-negative safe integer");
    }
    const total = subtotalCents + Math.round(subtotalCents * taxRate);
    if (!Number.isSafeInteger(total)) {
      throw new RangeError("Taxed total exceeds Number.MAX_SAFE_INTEGER");
    }
    return total === 0 ? 0 : total;
  };
}

// Pass-by-sharing: reassigning parameter does NOT affect caller; mutating property DOES
function testPassBySharing(obj, num) {
  num = 999;          // Reassigns local primitive copy only
  obj.touched = true; // Mutates shared heap object
  obj = { fresh: 1 }; // Reassigns local reference only; caller still points to old object
}

const payload = { id: 1 };
let count = 5;
testPassBySharing(payload, count);
console.log("Caller payload:", payload, "| Caller count:", count);

const applyVat = createTaxCalculator(0.2);
const subtotal = calculateLineTotalCents(1999, 2, 0.1);
console.log("Subtotal cents:", subtotal, "| With 20% VAT:", applyVat(subtotal));\`}

<TopicSection id="m01-p1-sec-e" letter="E" title="Step-by-Step Walkthrough">

Trace every runtime step of **Example 3** (\`testPassBySharing\` and \`applyVat\`):

1. **Module Creation Phase:** The engine parses all declarations, hoisting \`calculateLineTotalCents\`, \`createTaxCalculator\`, and \`testPassBySharing\` into the module lexical environment. \`payload\` and \`applyVat\` are registered in the TDZ.
2. **Execution — Heap Allocation:** \`const payload = { id: 1 }\` allocates an object on the heap (say at \`0x40A0\`) and stores the pointer \`0x40A0\` in the \`payload\` binding. \`let count = 5\` stores primitive \`5\` directly in the \`count\` binding.
3. **Function Invocation — Stack Frame Push:** \`testPassBySharing(payload, count)\` pushes a new frame onto the call stack. Parameter \`obj\` receives a *copy of the pointer* \`0x40A0\`; parameter \`num\` receives a *copy of the primitive* \`5\`.
4. **Inside Frame:**
   - \`num = 999\` overwrites the local \`num\` slot only; caller's \`count\` stays \`5\`.
   - \`obj.touched = true\` dereferences \`0x40A0\` on the heap and adds property \`touched: true\`. Because caller's \`payload\` points to \`0x40A0\`, caller observes the mutation.
   - \`obj = { fresh: 1 }\` allocates a brand-new heap object (say \`0x99B0\`) and updates the local \`obj\` binding. Caller's \`payload\` still points to \`0x40A0\`.
5. **Frame Pop:** When \`testPassBySharing\` returns \`undefined\`, its stack frame is popped. The unreferenced \`0x99B0\` object becomes eligible for garbage collection.
6. **Higher-Order Return:** \`createTaxCalculator(0.2)\` returns \`applyTax\`, which retains access to \`taxRate = 0.2\` via its closure lexical environment even after \`createTaxCalculator\`'s stack frame pops.

</TopicSection>

<TopicSection id="m01-p1-sec-f" letter="F" title="Real-World Use Cases">

#### Scenario 1: Fintech & E-Commerce Ledger Calculations (Preventing Float Drift)

**Problem:** A SaaS invoicing backend built in Node.js sums line items stored as floating-point dollars (\`19.99 + 0.01\` or \`0.1 + 0.2\`). Over thousands of ledger rows, binary rounding residue causes trial balances to fail reconciliation by 1 cent (\`$100.00000000000001 !== $100.00\`).

**Production Solution:** Store and compute all monetary values in integer minor units (\`amountCents\`, e.g., \`1999\` for \`$19.99\`, or \`BigInt\` / arbitrary-precision decimal libraries for sub-cent FX rates) and format to decimals only at the UI presentation boundary.

#### Scenario 2: Node.js / Express Request Boundary Normalization

**Problem:** HTTP query parameters always arrive as \`string\` values (e.g., \`?page=2&active=false\`). Treating \`"false"\` as a boolean directly fails because any non-empty string in JavaScript—including \`"false"\` and \`"0"\`—is **truthy**!

**Production Solution:** Write pure parser functions at the API boundary that explicitly check \`typeof\`, parse numbers with \`Number.isSafeInteger\`, and map \`"true"\` / \`"false"\` strings strictly before passing clean typed objects into business logic.

<CodeBlock
  lang="javascript"
  runnable
  code={\`function parseQueryFlags(query) {
  if (query === null || typeof query !== "object" || Array.isArray(query)) {
    throw new TypeError("query must be a plain object");
  }
  const proto = Object.getPrototypeOf(query);
  if (proto !== Object.prototype && proto !== null) {
    throw new TypeError("query must be a plain object");
  }

  const rawPage = Object.hasOwn(query, "page") ? query.page : undefined;
  let page = 1;
  if (rawPage !== undefined) {
    if (typeof rawPage === "number") {
      if (!Number.isSafeInteger(rawPage)) {
        throw new TypeError("page must be a safe integer");
      }
      page = rawPage;
    } else if (typeof rawPage === "string" && /^-?[0-9]+$/.test(rawPage.trim())) {
      page = Number(rawPage.trim());
    } else {
      throw new TypeError("page must be an integer or integer string");
    }
  }
  if (!Number.isSafeInteger(page) || page < 1 || page > 10000) {
    throw new RangeError("Invalid page parameter");
  }

  const rawActive = Object.hasOwn(query, "active") ? query.active : undefined;
  let active = null;
  if (rawActive === "true") active = true;
  else if (rawActive === "false") active = false;
  else if (rawActive !== undefined) {
    throw new TypeError("active must be 'true' or 'false'");
  }

  return { page, active };
}

console.log(parseQueryFlags({ page: "3", active: "false" }));\`}
/>

</TopicSection>

<TopicSection id="m01-p1-sec-g" letter="G" title="Common Mistakes">

- **Comparing floats with \`===\`:** Expecting \`0.1 + 0.2 === 0.3\` or \`1.005 * 100 === 100.5\` without tolerance (\`Number.EPSILON\`) or integer minor units.
- **Using loose equality (\`==\`):** \`"" == 0\`, \`" \\t\\n " == 0\`, and \`null == undefined\` evaluate to \`true\` due to abstract equality coercion rules.
- **Checking for objects with \`typeof x === "object"\` alone:** Forgetting that \`typeof null === "object"\` and \`typeof [] === "object"\`. Always guard with \`x !== null && typeof x === "object"\` (and \`Array.isArray(x)\` for arrays).
- **Assuming \`Boolean("false")\` is \`false\`:** Non-empty strings are always truthy. Aside from the legacy browser \`document.all\` quirk, only 8 values are falsy in JS: \`false\`, \`0\`, \`-0\`, \`0n\`, \`""\`, \`null\`, \`undefined\`, and \`NaN\`.
- **Mutating input objects inside helper functions:** Modifying passed objects/arrays in place creates hidden side effects that break React change detection and cause spooky bugs across services.
- **Using \`var\` in loops with async callbacks:** A single function-scoped \`var i\` is shared across every callback iteration, whereas \`let i\` creates a fresh lexical binding per iteration.

</TopicSection>

<TopicSection id="m01-p1-sec-h" letter="H" title="Best Practices">

- **Default to \`const\`, use \`let\` only when reassignment is required, never use \`var\`** in modern codebases.
- **Use strict equality (\`===\` and \`!==\`) everywhere** (except the rare intentional \`x == null\` check for both \`null\` and \`undefined\`, if team style allows it).
- **Prefer \`Number.isNaN\`, \`Number.isFinite\`, and \`Number.isSafeInteger\`** over global \`isNaN\` / \`isFinite\`, because the \`Number.*\` methods do not coerce non-numbers first.
- **Keep core domain functions pure:** accept explicit inputs, return new objects/values, push I/O (DB, HTTP, logging, clock) to the edges.
- **Validate at system boundaries** (API handlers, message consumers, env vars) and keep internal helper signatures concise (prefer an options object if a function takes more than 3 parameters).
- **Enable \`"use strict"\` (automatic in ES modules and classes)** so accidental global variables and silent assignment failures throw immediately.

</TopicSection>

<TopicSection id="m01-p1-sec-i" letter="I" title="Performance & Scalability">

- **Consistent Argument Shapes (Monomorphism):** JIT engines optimize functions best when they consistently receive the same types and object property shapes. Passing mixed types (sometimes string, sometimes number, sometimes differently shaped objects) forces polymorphic/megamorphic lookups and deoptimizations in hot loops.
- **Call Stack Depth Limits:** Typical JS engines allow roughly ~10,000 stack frames (varies by runtime and frame size). In Node.js/V8, Proper Tail Calls (PTC) are *not* enabled, so recursive algorithms on large trees or lists (100k+ nodes) will crash with \`RangeError: Maximum call stack size exceeded\` unless converted to an explicit stack/queue loop.
- **Allocation Pressure in Hot Loops:** Creating temporary objects or cloning large arrays inside high-frequency loops increases Garbage Collection pause frequency. Keep pure immutability for application state, but consider pre-allocated buffers/arrays or controlled local mutation inside tight inner hot paths proven by a profiler.
- **\`BigInt\` Trade-off:** \`BigInt\` arithmetic is slower than hardware-accelerated Smi/IEEE-754 \`Number\` operations and cannot be serialized directly by \`JSON.stringify()\` (throws \`TypeError\`). Use \`BigInt\` only where precision beyond 53 bits is genuinely required.

</TopicSection>

<TopicSection id="m01-p1-sec-j" letter="J" title="Security Considerations">

- **Type Confusion & Coercion Bypasses:** If an API expects a string token or integer role ID and receives an array/object from unvalidated JSON (e.g., \`{ "pin": [] }\` or \`req.query.id\` as an array \`?id=1&id=2\`), loose checks or unguarded string methods can bypass authorization or crash the server. Always assert runtime types with a schema validator (e.g., Zod, Joi, Ajv).
- **64-bit Database ID Truncation (Silent Data Corruption):** PostgreSQL \`BIGINT\` or Snowflake IDs up to \`2^63 - 1\` exceed \`Number.MAX_SAFE_INTEGER\` (\`2^53 - 1\`). Parsing them as JS \`Number\` silently rounds adjacent user IDs to the *same* number, risking cross-user data exposure! Serialize 64-bit IDs as \`string\` in JSON APIs.
- **Unbounded Recursion DoS:** Recursive JSON/AST walkers without a maximum depth guard allow attackers to send deeply nested payloads (e.g., 20,000 nested brackets) that crash the Node.js process via stack overflow.
- **Dynamic Code Execution:** Never pass user-controlled strings to \`eval()\`, \`new Function()\`, or string-form \`setTimeout()\`; this leads directly to Remote Code Execution (RCE) on Node.js or XSS in browsers.

</TopicSection>

<TopicSection id="m01-p1-sec-k" letter="K" title="Comparisons & Decision Tables">

#### 1. Variable Declarations: \`var\` vs. \`let\` vs. \`const\`

| Feature | \`var\` | \`let\` | \`const\` |
| --- | --- | --- | --- |
| Scope | Function (or global) | Block (\`{ ... }\`) | Block (\`{ ... }\`) |
| Hoisting & Initial State | Hoisted & initialized to \`undefined\` | Hoisted into TDZ (\`ReferenceError\` before init) | Hoisted into TDZ (\`ReferenceError\` before init) |
| Reassignment | Allowed | Allowed | Forbidden (\`TypeError\`) |
| Redeclaration in same scope | Allowed (error-prone) | SyntaxError | SyntaxError |
| When to use | Legacy code only | Loop counters, accumulators, conditional bindings | Default choice for 90%+ of bindings |

#### 2. Primitive Types vs. Reference Types (Objects)

| Dimension | Primitives (7 types) | Reference Type (\`object\`) |
| --- | --- | --- |
| Mutability | Immutable (operations create new values) | Mutable by default (properties can change unless frozen) |
| Assignment / Argument Passing | Copies the value itself | Copies the reference pointer (pass-by-sharing) |
| Equality (\`===\`) | Compared by value (except \`NaN !== NaN\`) | Compared by identity (same memory reference) |
| Typical Memory | Stack / register (or pooled string/heap for big strings) | Heap-allocated, reclaimed by Garbage Collector |

#### 3. Function Declaration vs. Expression vs. Arrow Function (Fundamentals)

| Aspect | Function Declaration | Function Expression | Arrow Function |
| --- | --- | --- | --- |
| Hoisting | Fully hoisted (callable before declaration line) | Variable hoisted only (\`TDZ\` for \`const/let\`) | Variable hoisted only (\`TDZ\` for \`const/let\`) |
| \`this\` binding | Dynamic (depends on call site) | Dynamic (depends on call site) | Lexical (inherits enclosing scope's \`this\`) |
| Constructor (\`new\`) | Yes | Yes | No (throws \`TypeError\`) |
| Best fit | Top-level named functions & module exports | Conditional/named callbacks | Callbacks, array transforms, preserving outer \`this\` |

</TopicSection>

<TopicSection id="m01-p1-sec-l" letter="L" title="Tips to Remember (Mnemonics & Mental Models)">

- **Mnemonic for the 7 Primitives: \`"BB NN SSU"\`** — \`B\`igInt, \`B\`oolean, \`N\`umber, \`N\`ull, \`S\`tring, \`S\`ymbol, \`U\`ndefined (+ 1 \`O\`bject = 8 total types).
- **\`const\` Analogy:** \`const\` welds the *leash* to one doghouse—you cannot point the leash at a different doghouse, but you can still repaint the doghouse inside (mutate properties).
- **Pass-by-Sharing Rule:** "You can change the furniture inside the house (\`obj.x = 2\`), but replacing your copy of the address card (\`obj = {}\`) leaves the caller's address card untouched."
- **Falsy Eight:** \`false\`, \`0\`, \`-0\`, \`0n\`, \`""\`, \`null\`, \`undefined\`, \`NaN\` (plus legacy browser \`document.all\`). Everything else—including \`[]\`, \`{}\`, and \`"false"\`—is truthy.
- **Money & Big IDs Rule:** "Cents for money, Strings for 64-bit IDs."

</TopicSection>

<ExerciseCard
  title="Exercise 1: Precision-Safe Invoice Splitter"
  prompt={
    <p>
      Write a pure function <code>splitAmountCents(totalCents, parts)</code> that splits an integer cent amount evenly across <code>parts</code> participants without losing or creating a single cent (distribute any remainder cents one each to the first participants). Validate inputs strictly.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`function splitAmountCents(totalCents, parts) {
  if (!Number.isSafeInteger(totalCents) || totalCents < 0) {
    throw new TypeError("totalCents must be a non-negative safe integer");
  }
  if (!Number.isSafeInteger(parts) || parts < 1) {
    throw new TypeError("parts must be a positive safe integer");
  }
  if (parts > 100000) {
    throw new RangeError("parts must not exceed 100000");
  }

  const normalizedTotal = totalCents === 0 ? 0 : totalCents;
  const base = Math.floor(normalizedTotal / parts);
  const remainder = normalizedTotal % parts;
  const result = [];

  for (let i = 0; i < parts; i++) {
    result.push(i < remainder ? base + 1 : base);
  }
  return result;
}

console.log("$10.00 / 3:", splitAmountCents(1000, 3)); // [334, 333, 333] -> sum is 1000\`}
  />
</ExerciseCard>

<ExerciseCard
  title="Exercise 2: Stack-Safe Iterative Array Flattener"
  prompt={
    <p>
      Write a function <code>flattenIterative(nested, maxDepth = 1000)</code> that flattens arbitrarily nested arrays without recursion (so 20,000 nested arrays will not throw a stack overflow), while guarding against cyclic or excessively deep input.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`function flattenIterative(nested, maxDepth = 1000) {
  if (!Array.isArray(nested)) {
    throw new TypeError("Input must be an array");
  }
  if (typeof maxDepth !== "number" || !Number.isSafeInteger(maxDepth)) {
    throw new TypeError("maxDepth must be a safe integer");
  }
  if (maxDepth < 1) {
    throw new RangeError("maxDepth must be at least 1");
  }

  const output = [];
  const active = new Set();
  const stack = [{ type: "enter", value: nested, depth: 0 }];

  while (stack.length > 0) {
    const frame = stack.pop();
    if (frame.type === "exit") {
      active.delete(frame.value);
      continue;
    }

    const { value, depth } = frame;
    if (Array.isArray(value)) {
      if (active.has(value)) {
        throw new TypeError("Cyclic array reference detected");
      }
      if (depth >= maxDepth) {
        throw new RangeError(\\\`Exceeded max nesting depth of \\\${maxDepth}\\\`);
      }
      active.add(value);
      stack.push({ type: "exit", value });
      for (let i = value.length - 1; i >= 0; i--) {
        stack.push({ type: "enter", value: value[i], depth: depth + 1 });
      }
    } else {
      output.push(value);
    }
  }
  return output;
}

console.log(flattenIterative([1, [2, [3, 4]], 5]));\`}
  />
</ExerciseCard>

<ExerciseCard
  title="Exercise 3: Pure Request Normalizer & Higher-Order Pipeline"
  prompt={
    <p>
      Create a higher-order function <code>composeValidators(...validators)</code> that runs an array of pure validation/transformation functions sequentially over an input object without mutating the caller's object.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`function composeValidators(...fns) {
  for (const fn of fns) {
    if (typeof fn !== "function") {
      throw new TypeError("All validators must be functions");
    }
  }
  return function runPipeline(initialInput) {
    if (initialInput === null || typeof initialInput !== "object" || Array.isArray(initialInput)) {
      throw new TypeError("Input must be a plain object");
    }
    const proto = Object.getPrototypeOf(initialInput);
    if (proto !== Object.prototype && proto !== null) {
      throw new TypeError("Input must be a plain object");
    }
    let current = { ...initialInput };
    for (const fn of fns) {
      current = fn(current);
    }
    return current;
  };
}

const trimEmail = (u) => {
  const rawEmail = Object.hasOwn(u, "email") ? u.email : undefined;
  if (typeof rawEmail !== "string" || rawEmail.trim().length === 0) {
    throw new TypeError("email must be a non-empty string");
  }
  return { ...u, email: rawEmail.trim().toLowerCase() };
};

const requireAge = (u) => {
  const rawAge = Object.hasOwn(u, "age") ? u.age : undefined;
  let age;
  if (typeof rawAge === "number") {
    if (!Number.isSafeInteger(rawAge)) {
      throw new TypeError("age must be a safe integer");
    }
    age = rawAge;
  } else if (typeof rawAge === "string" && /^-?[0-9]+$/.test(rawAge.trim())) {
    age = Number(rawAge.trim());
  } else {
    throw new TypeError("age must be an integer or integer string");
  }
  if (!Number.isSafeInteger(age) || age < 18 || age > 130) {
    throw new RangeError("Must be 18+");
  }
  return { ...u, age };
};

const normalizeSignup = composeValidators(trimEmail, requireAge);
const raw = { email: "  Alice@Example.COM ", age: "25" };
console.log("Normalized:", normalizeSignup(raw), "| Original:", raw);\`}
  />
</ExerciseCard>

<TopicSection id="m01-p1-sec-q" letter="Q" title="Summary & Key Takeaways">

- Source code moves from **Lexing/Parsing (AST) → Scope Creation (TDZ/Hoisting) → Bytecode & JIT**, using the **Call Stack** for frames/primitives and the **Heap** for dynamic objects.
- Default to \`const\`, use \`let\` when rebinding is needed, and avoid \`var\`. Remember \`const\` freezes the binding, not heap properties.
- JavaScript has **8 types** (7 immutable primitives + mutable \`object\`). Numbers are 64-bit IEEE-754 floats: never use floats for money and never use \`Number\` for 64-bit IDs beyond \`2^53 - 1\`.
- Arguments are passed **by value** (copying primitive values, or copying object pointers—pass-by-sharing).
- Prefer pure functions for business logic, strict equality (\`===\`), explicit boundary validation, and iterative loops over unbounded recursion in Node.js.

</TopicSection>

`,(0,S.jsxs)(l,{id:`m01-p2-sec-b`,letter:`B`,title:`Fundamentals (Simple Mental Models)`,children:[(0,S.jsx)(c,{id:`m01-p2-topic-objects`}),(0,S.jsx)(t.h4,{children:`1. Objects: Key-Value Records, Prototypes & Property Descriptors`}),(0,S.jsxs)(t.p,{children:[`An `,(0,S.jsx)(t.strong,{children:`object`}),` in JavaScript is a mutable dictionary mapping string (or `,(0,S.jsx)(t.code,{children:`Symbol`}),`) keys to values. Values can be data (`,(0,S.jsx)(t.strong,{children:`properties`}),`) or functions (`,(0,S.jsx)(t.strong,{children:`methods`}),`). Every plain `,(0,S.jsx)(t.code,{children:`{}`}),` delegates missing key lookups to `,(0,S.jsx)(t.code,{children:`Object.prototype`}),`, so checking membership with `,(0,S.jsx)(t.code,{children:`"toString" in {}`}),` returns `,(0,S.jsx)(t.code,{children:`true`}),`. Always use `,(0,S.jsx)(t.code,{children:`Object.hasOwn(obj, key)`}),` (ES2022) to check own properties safely—even on `,(0,S.jsx)(t.code,{children:`Object.create(null)`}),` dictionaries that have no prototype.`]}),(0,S.jsxs)(t.p,{children:[`Underneath every property sits a `,(0,S.jsx)(o,{definition:`Metadata object describing a property's value/getter/setter and behavioral flags: writable, enumerable, and configurable.`,children:`Property Descriptor`}),` with four flags: `,(0,S.jsx)(t.code,{children:`value`}),`, `,(0,S.jsx)(t.code,{children:`writable`}),` (can be reassigned), `,(0,S.jsx)(t.code,{children:`enumerable`}),` (appears in `,(0,S.jsx)(t.code,{children:`Object.keys`}),` / `,(0,S.jsx)(t.code,{children:`for..in`}),` / `,(0,S.jsx)(t.code,{children:`JSON.stringify`}),`), and `,(0,S.jsx)(t.code,{children:`configurable`}),` (can be deleted or reconfigured). Calling `,(0,S.jsx)(t.code,{children:`Object.freeze(obj)`}),` sets `,(0,S.jsx)(t.code,{children:`writable: false`}),` and `,(0,S.jsx)(t.code,{children:`configurable: false`}),` on own properties—though only `,(0,S.jsx)(t.strong,{children:`shallowly`}),`! Spread syntax `,(0,S.jsx)(t.code,{children:`{ ...user }`}),` is also shallow: nested objects like `,(0,S.jsx)(t.code,{children:`user.address`}),` remain shared by reference unless cloned deeply with `,(0,S.jsx)(t.code,{children:`structuredClone(user)`}),`.`]}),(0,S.jsxs)(t.p,{children:[`For dynamic key-value collections, prefer `,(0,S.jsx)(t.code,{children:`Map`}),` and `,(0,S.jsx)(t.code,{children:`Set`}),` over plain `,(0,S.jsx)(t.code,{children:`{}`}),`—and when attaching metadata or visited-state to objects without preventing garbage collection, use `,(0,S.jsx)(t.strong,{children:(0,S.jsx)(t.code,{children:`WeakMap`})}),` and `,(0,S.jsx)(t.strong,{children:(0,S.jsx)(t.code,{children:`WeakSet`})}),`. Unlike `,(0,S.jsx)(t.code,{children:`Map`}),`/`,(0,S.jsx)(t.code,{children:`Set`}),`, weak collections hold `,(0,S.jsx)(t.strong,{children:`weak references`}),` to object keys (so entries are automatically reclaimed when the key object becomes unreachable elsewhere) and are intentionally non-enumerable (no `,(0,S.jsx)(t.code,{children:`.size`}),`, `,(0,S.jsx)(t.code,{children:`.keys()`}),`, or `,(0,S.jsx)(t.code,{children:`for..of`}),` iteration).`]}),(0,S.jsx)(c,{id:`m01-p2-topic-arrays`}),(0,S.jsx)(t.h4,{children:`2. Arrays: Ordered Lists, Mutation Traps & Non-Mutating Methods`}),(0,S.jsxs)(t.p,{children:[`An `,(0,S.jsx)(t.strong,{children:`array`}),` is a specialized object optimized for non-negative integer indices `,(0,S.jsx)(t.code,{children:`0, 1, 2, ...`}),` and an auto-updating `,(0,S.jsx)(t.code,{children:`.length`}),` property. Appending or removing at the tail (`,(0,S.jsx)(t.code,{children:`.push()`}),`, `,(0,S.jsx)(t.code,{children:`.pop()`}),`) is amortized `,(0,S.jsx)(t.code,{children:`O(1)`}),`, whereas inserting or removing at index `,(0,S.jsx)(t.code,{children:`0`}),` (`,(0,S.jsx)(t.code,{children:`.unshift()`}),`, `,(0,S.jsx)(t.code,{children:`.shift()`}),`) shifts every remaining element (`,(0,S.jsx)(t.code,{children:`O(n)`}),`).`]}),(0,S.jsxs)(t.p,{children:[`Pay close attention to `,(0,S.jsx)(t.strong,{children:`mutating vs. non-mutating`}),` array methods. Classic methods like `,(0,S.jsx)(t.code,{children:`.push()`}),`, `,(0,S.jsx)(t.code,{children:`.pop()`}),`, `,(0,S.jsx)(t.code,{children:`.splice()`}),`, `,(0,S.jsx)(t.code,{children:`.sort()`}),`, and `,(0,S.jsx)(t.code,{children:`.reverse()`}),` mutate the array in place—which causes subtle bugs when sorting React props or shared state. Modern ES2023 non-mutating counterparts—`,(0,S.jsx)(t.code,{children:`.toSorted()`}),`, `,(0,S.jsx)(t.code,{children:`.toReversed()`}),`, `,(0,S.jsx)(t.code,{children:`.toSpliced()`}),`, and `,(0,S.jsx)(t.code,{children:`.with(index, value)`}),`—alongside `,(0,S.jsx)(t.code,{children:`.map()`}),`, `,(0,S.jsx)(t.code,{children:`.filter()`}),`, and `,(0,S.jsx)(t.code,{children:`.slice()`}),` always return a `,(0,S.jsx)(t.strong,{children:`new`}),` array and leave the original untouched.`]}),(0,S.jsx)(c,{id:`m01-p2-topic-classes`}),(0,S.jsx)(t.h4,{children:`3. Classes: Blueprints, Constructors, Accessors & Static Members`}),(0,S.jsxs)(t.p,{children:[`Introduced in ES2015, a `,(0,S.jsx)(t.strong,{children:(0,S.jsx)(t.code,{children:`class`})}),` packages a `,(0,S.jsx)(t.code,{children:`constructor`}),` (which initializes each instance when invoked with `,(0,S.jsx)(t.code,{children:`new`}),`), shared instance methods (stored once on `,(0,S.jsx)(t.code,{children:`ClassName.prototype`}),`), `,(0,S.jsx)(t.code,{children:`get`}),`/`,(0,S.jsx)(t.code,{children:`set`}),` computed accessors, and `,(0,S.jsx)(t.code,{children:`static`}),` utility/factory methods attached directly to the class constructor itself (e.g., `,(0,S.jsx)(t.code,{children:`User.fromDTO(dto)`}),`).`]}),(0,S.jsxs)(t.p,{children:[`Unlike legacy constructor functions, ES2015+ classes enforce critical runtime safety rules: the class body always runs in `,(0,S.jsx)(t.strong,{children:`strict mode`}),`, methods are non-enumerable by default, and calling a class without `,(0,S.jsx)(t.code,{children:`new`}),` throws a `,(0,S.jsx)(t.code,{children:`TypeError`}),` immediately. Use `,(0,S.jsx)(t.code,{children:`instanceof`}),` to test whether an object's prototype chain includes a class constructor.`]}),(0,S.jsx)(c,{id:`m01-p2-topic-oop`}),(0,S.jsx)(t.h4,{children:`4. OOP: Modeling Domains Around Collaborating Objects`}),(0,S.jsxs)(t.p,{children:[(0,S.jsx)(t.strong,{children:`Object-Oriented Programming (OOP)`}),` structures a codebase around domain objects that combine relevant state with the operations allowed on that state, rather than scattering raw data structures and unrelated helper functions across files. Each object acts as a boundary responsible for its own consistency.`]}),(0,S.jsxs)(t.p,{children:[`OOP rests on four complementary pillars—`,(0,S.jsx)(t.strong,{children:`Encapsulation`}),`, `,(0,S.jsx)(t.strong,{children:`Abstraction`}),`, `,(0,S.jsx)(t.strong,{children:`Inheritance`}),`, and `,(0,S.jsx)(t.strong,{children:`Polymorphism`}),` (`,(0,S.jsx)(t.strong,{children:`A-P-I-E`}),`). In modern JavaScript and TypeScript, engineers combine OOP boundaries for stateful domain entities (`,(0,S.jsx)(t.code,{children:`LedgerAccount`}),`, `,(0,S.jsx)(t.code,{children:`Order`}),`, `,(0,S.jsx)(t.code,{children:`RateLimiter`}),`) with functional immutability for data transformations.`]}),(0,S.jsx)(c,{id:`m01-p2-topic-encapsulation`}),(0,S.jsxs)(t.h4,{children:[`5. Encapsulation: Protecting Invariants with `,(0,S.jsx)(t.code,{children:`#private`}),` State`]}),(0,S.jsxs)(t.p,{children:[(0,S.jsx)(o,{definition:`Bundling state and behavior together while restricting direct external mutation so internal invariants cannot be bypassed.`,children:`Encapsulation`}),` ensures callers can only change an object's state through validated methods rather than corrupting fields directly (such as setting `,(0,S.jsx)(t.code,{children:`account.balance = -500`}),`). Naming conventions like `,(0,S.jsx)(t.code,{children:`_balance`}),` only ask nicely—external code can still read, mutate, and serialize `,(0,S.jsx)(t.code,{children:`_balance`}),`.`]}),(0,S.jsxs)(t.p,{children:[`In ES2022+, prefixing a class field or method with `,(0,S.jsx)(t.code,{children:`#`}),` (e.g., `,(0,S.jsx)(t.code,{children:`#balanceCents`}),`) creates true runtime encapsulation: referencing `,(0,S.jsx)(t.code,{children:`account.#balanceCents`}),` outside the declaring class fails at parse time with a `,(0,S.jsx)(t.code,{children:`SyntaxError`}),`, and `,(0,S.jsx)(t.code,{children:`#private`}),` slots never leak into `,(0,S.jsx)(t.code,{children:`Object.keys()`}),`, `,(0,S.jsx)(t.code,{children:`for..in`}),`, or `,(0,S.jsx)(t.code,{children:`JSON.stringify()`}),`.`]}),(0,S.jsx)(c,{id:`m01-p2-topic-abstraction`}),(0,S.jsx)(t.h4,{children:`6. Abstraction: Minimal Public Contracts Over Complex Internals`}),(0,S.jsxs)(t.p,{children:[(0,S.jsx)(o,{definition:`Exposing only a clean, minimal public interface while hiding complex internal workflows, protocols, or storage details.`,children:`Abstraction`}),` separates `,(0,S.jsx)(t.em,{children:`what`}),` a component does from `,(0,S.jsx)(t.em,{children:`how`}),` it does it. When `,(0,S.jsx)(t.code,{children:`CheckoutService`}),` calls `,(0,S.jsx)(t.code,{children:`gateway.charge(amountCents)`}),`, it only depends on a simple input/output contract (`,(0,S.jsx)(t.code,{children:`charge(cents) -> Receipt`}),`), hiding HTTP retries, HMAC signing, webhook verification, and vendor SDK quirks behind that boundary.`]}),(0,S.jsx)(t.p,{children:`Good abstraction shrinks cognitive load and localizes change: if you swap payment providers or migrate from SMTP to AWS SES, callers depending only on the narrow abstraction require zero code changes.`}),(0,S.jsx)(c,{id:`m01-p2-topic-inheritance`}),(0,S.jsxs)(t.h4,{children:[`7. Inheritance: Shallow `,(0,S.jsx)(t.code,{children:`extends`}),` Taxonomies vs. Composition`]}),(0,S.jsxs)(t.p,{children:[(0,S.jsx)(o,{definition:`Defining a specialized child class via extends that reuses and refines a parent class's contract while initializing parent state with super().`,children:`Inheritance`}),` creates a subtype relationship (`,(0,S.jsx)(t.code,{children:`class RateLimitError extends AppError`}),`) where the child class inherits prototype methods, initializes parent state via `,(0,S.jsx)(t.code,{children:`super(...)`}),`, and can override behavior while delegating back with `,(0,S.jsx)(t.code,{children:`super.method()`}),`. Note that a child class does `,(0,S.jsx)(t.strong,{children:`not`}),` inherit direct access to a parent's `,(0,S.jsx)(t.code,{children:`#private`}),` fields—it must use the parent's public API.`]}),(0,S.jsxs)(t.p,{children:[`Reserve inheritance for shallow, genuine `,(0,S.jsx)(t.em,{children:`"is-a"`}),` hierarchies (such as typed `,(0,S.jsx)(t.code,{children:`Error`}),` subclasses). Deep `,(0,S.jsx)(t.code,{children:`extends`}),` chains create tight coupling (`,(0,S.jsx)(t.strong,{children:`Fragile Base Class`}),` problem); for sharing capabilities across services, prefer `,(0,S.jsx)(t.strong,{children:`composition`}),` (`,(0,S.jsx)(t.em,{children:`"has-a"`}),`).`]}),(0,S.jsx)(c,{id:`m01-p2-topic-polymorphism`}),(0,S.jsx)(t.h4,{children:`8. Polymorphism: Uniform Dispatch Across Interchangeable Types`}),(0,S.jsxs)(t.p,{children:[(0,S.jsx)(o,{definition:`Allowing different classes or objects implementing the same method contract to be used interchangeably through a shared caller interface.`,children:`Polymorphism`}),` (`,(0,S.jsx)(t.em,{children:`"many forms"`}),`) lets a single piece of orchestration code work uniformly across multiple implementations without `,(0,S.jsx)(t.code,{children:`if (provider === "stripe") ... else if (provider === "paypal")`}),` branches. Both `,(0,S.jsx)(t.code,{children:`StripeGateway`}),` and `,(0,S.jsx)(t.code,{children:`MockGateway`}),` implement `,(0,S.jsx)(t.code,{children:`.charge(cents)`}),` and return a consistent receipt shape.`]}),(0,S.jsxs)(t.p,{children:[`Because JavaScript is dynamically typed, polymorphism works both via shared parent classes (`,(0,S.jsx)(t.code,{children:`extends`}),`) and via structural `,(0,S.jsx)(t.strong,{children:`duck typing`}),` (any object exposing the expected method signature). To stay reliable, every polymorphic implementation must honor the same input, output, and error contract.`]}),(0,S.jsx)(c,{id:`m01-p2-topic-solid`}),(0,S.jsx)(t.h4,{children:`9. SOLID Fundamentals: Five Guidelines for Modular Change`}),(0,S.jsxs)(t.p,{children:[`Coined and popularized by Robert C. Martin, `,(0,S.jsx)(o,{definition:`Five object-oriented design principles (SRP, OCP, LSP, ISP, DIP) that keep software modular, extensible, and testable.`,children:`SOLID`}),` provides five practical guardrails against rigid, tightly coupled code:`]}),(0,S.jsxs)(t.ol,{children:[`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.strong,{children:`S — Single Responsibility Principle (SRP):`}),` A class or module should serve one cohesive actor/reason to change (keep tax math separate from PDF rendering and SQL persistence).`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.strong,{children:`O — Open/Closed Principle (OCP):`}),` Open for extension, closed for modification—add new variants (discount rules, notification channels) by registering a new class/strategy rather than editing core `,(0,S.jsx)(t.code,{children:`switch`}),` statements.`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsxs)(t.strong,{children:[`L — `,(0,S.jsx)(o,{definition:`Subtypes or interchangeable implementations must preserve the caller's expectations around inputs, return shapes, and error behavior.`,children:`Liskov Substitution Principle (LSP)`}),`:`]}),` Any subtype or strategy implementation must honor the base contract (never throwing unexpected error types or returning incompatible shapes).`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.strong,{children:`I — Interface Segregation Principle (ISP):`}),` Prefer small, focused contracts (`,(0,S.jsx)(t.code,{children:`Readable`}),`, `,(0,S.jsx)(t.code,{children:`Chargeable`}),`) over bloated interfaces so callers and test mocks only implement what they actually use.`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsxs)(t.strong,{children:[`D — `,(0,S.jsx)(o,{definition:`High-level business policy should depend on minimal abstractions/interfaces injected from outside rather than concrete low-level SDKs.`,children:`Dependency Inversion Principle (DIP)`}),`:`]}),` High-level policy (`,(0,S.jsx)(t.code,{children:`CheckoutService`}),`) depends on an abstraction (`,(0,S.jsx)(t.code,{children:`PaymentGateway`}),`), and concrete adapters (`,(0,S.jsx)(t.code,{children:`StripeGateway`}),`) are injected via constructor parameters rather than imported and instantiated inside core logic.`]}),`
`]})]}),`
`,(0,S.jsxs)(l,{id:`m01-p2-sec-c`,letter:`C`,title:`Internal Working & Architecture`,children:[(0,S.jsx)(t.h4,{children:`1. V8 Hidden Classes (Maps) & Inline Caches for Objects`}),(0,S.jsxs)(t.p,{children:[`In static languages like C++ or Java, the compiler knows the exact byte offset of `,(0,S.jsx)(t.code,{children:`user.email`}),` at compile time. In JavaScript, objects can gain or lose keys at runtime. To avoid slow hash-table lookups on every property access, V8 builds internal `,(0,S.jsx)(o,{definition:`Internal V8 metadata (also called Shapes or Maps) describing an object's property names and byte offsets.`,children:`Hidden Classes`}),`:`]}),(0,S.jsxs)(t.ul,{children:[`
`,(0,S.jsxs)(t.li,{children:[`When you create `,(0,S.jsx)(t.code,{children:`{ id: 1, name: "A" }`}),`, V8 creates Hidden Class `,(0,S.jsx)(t.code,{children:`C0`}),` → `,(0,S.jsx)(t.code,{children:`C1 (id @ offset 0)`}),` → `,(0,S.jsx)(t.code,{children:`C2 (name @ offset 1)`}),`.`]}),`
`,(0,S.jsxs)(t.li,{children:[`If another object initializes keys in the `,(0,S.jsx)(t.strong,{children:`same order`}),` (`,(0,S.jsx)(t.code,{children:`{ id: 2, name: "B" }`}),`), it shares `,(0,S.jsx)(t.code,{children:`C2`}),`. V8's `,(0,S.jsx)(t.strong,{children:`Inline Cache (IC)`}),` remembers `,(0,S.jsx)(t.code,{children:`C2`}),` and reads `,(0,S.jsx)(t.code,{children:`obj.name`}),` in one pointer offset check.`]}),`
`,(0,S.jsxs)(t.li,{children:[`If a third object initializes keys in a `,(0,S.jsx)(t.strong,{children:`different order`}),` (`,(0,S.jsx)(t.code,{children:`{ name: "C", id: 3 }`}),`) or dynamically adds `,(0,S.jsx)(t.code,{children:`obj.role = "admin"`}),` later, it branches into a different Hidden Class tree, turning fast monomorphic reads into slower polymorphic or dictionary lookups.`]}),`
`]}),(0,S.jsx)(t.h4,{children:`2. V8 Array Elements Kinds (Packed vs. Holey Transitions)`}),(0,S.jsxs)(t.p,{children:[`Standard JS arrays are objects under the hood, but V8 optimizes numeric and dense arrays into contiguous C-style backing stores categorized by `,(0,S.jsx)(t.strong,{children:`Elements Kinds`}),` `,(0,S.jsx)(t.em,{children:`(V8 implementation detail, not an ECMA-262 rule)`}),`:`]}),(0,S.jsxs)(t.ul,{children:[`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.code,{children:`PACKED_SMI_ELEMENTS`}),`: Dense array of small 31-bit integers (`,(0,S.jsx)(t.code,{children:`[1, 2, 3]`}),`) — fastest, unboxed.`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.code,{children:`PACKED_DOUBLE_ELEMENTS`}),`: Adding a float (`,(0,S.jsx)(t.code,{children:`arr.push(1.5)`}),`) downgrades the backing store to unboxed 64-bit floats.`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.code,{children:`PACKED_ELEMENTS`}),`: Adding a string or object (`,(0,S.jsx)(t.code,{children:`arr.push("ok")`}),`) downgrades to generic tagged pointers.`]}),`
`,(0,S.jsxs)(t.li,{children:[(0,S.jsx)(t.code,{children:`HOLEY_*`}),`: Leaving gaps (`,(0,S.jsx)(t.code,{children:`[1, , 3]`}),`, `,(0,S.jsx)(t.code,{children:`arr[500] = 9`}),`, or `,(0,S.jsx)(t.code,{children:`delete arr[1]`}),`) marks the array `,(0,S.jsx)(t.strong,{children:`holey`}),`. Whenever you read a hole, V8 must check `,(0,S.jsx)(t.code,{children:`Array.prototype`}),` up the prototype chain in case someone defined a property at that index!`]}),`

class LedgerAccount {

  if (typeof owner !== "string" || owner.trim().length === 0) {
    throw new TypeError("owner must be a non-empty string");

  }

}

    throw new RangeError("Deposit must be positive integer cents");
  }
  if (!Number.isSafeInteger(this.#balanceCents + cents)) {
    throw new RangeError("Balance would exceed Number.MAX_SAFE_INTEGER");
  }
  this.#balanceCents += cents;
  this.#entries.push({ type: "CREDIT", cents });
}

get balanceCents() {
  return this.#balanceCents;
}

toJSON() {
  return { owner: this.owner, balanceCents: this.#balanceCents, count: this.#entries.length };

charge(cents) {

}

charge(cents) {

}
}

class CheckoutService {

constructor(gateway) {

    throw new TypeError("gateway must implement charge(cents)");

<TopicSection id="m01-p2-sec-a" letter="A" title="Topic Introduction">

#### What is this?

Once you know how single variables and functions work, real software needs ways to group related data and behavior together. <GlossaryTerm definition="An unordered collection of key-value pairs (properties and methods) stored on the heap.">Objects</GlossaryTerm> model structured entities (a user, an invoice, an HTTP request), while <GlossaryTerm definition="An ordered, zero-indexed list structure optimized for sequential storage and iteration.">Arrays</GlossaryTerm> model ordered collections of items.

<GlossaryTerm definition="A blueprint syntax in ES2015+ for creating objects with shared methods, constructors, and optional private fields.">Classes</GlossaryTerm> and <GlossaryTerm definition="Object-Oriented Programming: a paradigm organizing software around objects that bundle state and behavior using Encapsulation, Inheritance, Polymorphism, and Abstraction.">OOP</GlossaryTerm> give teams a structured way to protect internal invariants (**Encapsulation**), hide noisy implementation details (**Abstraction**), share contracts (**Inheritance**), and swap behaviors cleanly (**Polymorphism**). **SOLID fundamentals** are five practical design guidelines that keep object-oriented codebases modular, testable, and resilient to change.

#### Why does it exist & what problem does it solve?

Without objects, arrays, and modular boundaries, large codebases turn into hundreds of loosely related global variables and giant \`if/else\` chains where any change breaks unrelated features:

- **Objects & Arrays** replace dozens of disconnected variables (\`user1Name\`, \`user1Email\`) with cohesive data structures.
- **Encapsulation & Abstraction** prevent external callers from corrupting internal state (for example, setting \`invoice.total = -500\` directly).
- **Polymorphism & SOLID** let you add new payment providers, storage backends, or notification channels without rewriting tested core workflows.

#### Where is it used in real-world software?

Every production layer uses these concepts daily: React props and Redux state are immutable object/array trees; Express request/response objects and middleware chains use object composition; ORMs (Prisma, TypeORM), domain models, and backend service layers rely on classes, interfaces, dependency inversion, and polymorphism to keep business logic decoupled from databases and third-party APIs.

</TopicSection>

<TopicSection id="m01-p2-sec-b" letter="B" title="Fundamentals (Simple Mental Models)">

<TopicAnchor id="m01-p2-topic-objects" />

#### 1. Objects: Key-Value Records, Prototypes & Property Descriptors

An **object** in JavaScript is a mutable dictionary mapping string (or \`Symbol\`) keys to values. Values can be data (**properties**) or functions (**methods**). Every plain \`{}\` delegates missing key lookups to \`Object.prototype\`, so checking membership with \`"toString" in {}\` returns \`true\`. Always use \`Object.hasOwn(obj, key)\` (ES2022) to check own properties safely—even on \`Object.create(null)\` dictionaries that have no prototype.

Underneath every property sits a <GlossaryTerm definition="Metadata object describing a property's value/getter/setter and behavioral flags: writable, enumerable, and configurable.">Property Descriptor</GlossaryTerm> with four flags: \`value\`, \`writable\` (can be reassigned), \`enumerable\` (appears in \`Object.keys\` / \`for..in\` / \`JSON.stringify\`), and \`configurable\` (can be deleted or reconfigured). Calling \`Object.freeze(obj)\` sets \`writable: false\` and \`configurable: false\` on own properties—though only **shallowly**! Spread syntax \`{ ...user }\` is also shallow: nested objects like \`user.address\` remain shared by reference unless cloned deeply with \`structuredClone(user)\`.

For dynamic key-value collections, prefer \`Map\` and \`Set\` over plain \`{}\`—and when attaching metadata or visited-state to objects without preventing garbage collection, use **\`WeakMap\`** and **\`WeakSet\`**. Unlike \`Map\`/\`Set\`, weak collections hold **weak references** to object keys (so entries are automatically reclaimed when the key object becomes unreachable elsewhere) and are intentionally non-enumerable (no \`.size\`, \`.keys()\`, or \`for..of\` iteration).

<TopicAnchor id="m01-p2-topic-arrays" />

#### 2. Arrays: Ordered Lists, Mutation Traps & Non-Mutating Methods

An **array** is a specialized object optimized for non-negative integer indices \`0, 1, 2, ...\` and an auto-updating \`.length\` property. Appending or removing at the tail (\`.push()\`, \`.pop()\`) is amortized \`O(1)\`, whereas inserting or removing at index \`0\` (\`.unshift()\`, \`.shift()\`) shifts every remaining element (\`O(n)\`).

Pay close attention to **mutating vs. non-mutating** array methods. Classic methods like \`.push()\`, \`.pop()\`, \`.splice()\`, \`.sort()\`, and \`.reverse()\` mutate the array in place—which causes subtle bugs when sorting React props or shared state. Modern ES2023 non-mutating counterparts—\`.toSorted()\`, \`.toReversed()\`, \`.toSpliced()\`, and \`.with(index, value)\`—alongside \`.map()\`, \`.filter()\`, and \`.slice()\` always return a **new** array and leave the original untouched.

<TopicAnchor id="m01-p2-topic-classes" />

#### 3. Classes: Blueprints, Constructors, Accessors & Static Members

Introduced in ES2015, a **\`class\`** packages a \`constructor\` (which initializes each instance when invoked with \`new\`), shared instance methods (stored once on \`ClassName.prototype\`), \`get\`/\`set\` computed accessors, and \`static\` utility/factory methods attached directly to the class constructor itself (e.g., \`User.fromDTO(dto)\`).

Unlike legacy constructor functions, ES2015+ classes enforce critical runtime safety rules: the class body always runs in **strict mode**, methods are non-enumerable by default, and calling a class without \`new\` throws a \`TypeError\` immediately. Use \`instanceof\` to test whether an object's prototype chain includes a class constructor.

<TopicAnchor id="m01-p2-topic-oop" />

#### 4. OOP: Modeling Domains Around Collaborating Objects

**Object-Oriented Programming (OOP)** structures a codebase around domain objects that combine relevant state with the operations allowed on that state, rather than scattering raw data structures and unrelated helper functions across files. Each object acts as a boundary responsible for its own consistency.

OOP rests on four complementary pillars—**Encapsulation**, **Abstraction**, **Inheritance**, and **Polymorphism** (**A-P-I-E**). In modern JavaScript and TypeScript, engineers combine OOP boundaries for stateful domain entities (\`LedgerAccount\`, \`Order\`, \`RateLimiter\`) with functional immutability for data transformations.

<TopicAnchor id="m01-p2-topic-encapsulation" />

#### 5. Encapsulation: Protecting Invariants with \`#private\` State

<GlossaryTerm definition="Bundling state and behavior together while restricting direct external mutation so internal invariants cannot be bypassed.">Encapsulation</GlossaryTerm> ensures callers can only change an object's state through validated methods rather than corrupting fields directly (such as setting \`account.balance = -500\`). Naming conventions like \`_balance\` only ask nicely—external code can still read, mutate, and serialize \`_balance\`.

In ES2022+, prefixing a class field or method with \`#\` (e.g., \`#balanceCents\`) creates true runtime encapsulation: referencing \`account.#balanceCents\` outside the declaring class fails at parse time with a \`SyntaxError\`, and \`#private\` slots never leak into \`Object.keys()\`, \`for..in\`, or \`JSON.stringify()\`.

<TopicAnchor id="m01-p2-topic-abstraction" />

#### 6. Abstraction: Minimal Public Contracts Over Complex Internals

<GlossaryTerm definition="Exposing only a clean, minimal public interface while hiding complex internal workflows, protocols, or storage details.">Abstraction</GlossaryTerm> separates *what* a component does from *how* it does it. When \`CheckoutService\` calls \`gateway.charge(amountCents)\`, it only depends on a simple input/output contract (\`charge(cents) -> Receipt\`), hiding HTTP retries, HMAC signing, webhook verification, and vendor SDK quirks behind that boundary.

Good abstraction shrinks cognitive load and localizes change: if you swap payment providers or migrate from SMTP to AWS SES, callers depending only on the narrow abstraction require zero code changes.

<TopicAnchor id="m01-p2-topic-inheritance" />

#### 7. Inheritance: Shallow \`extends\` Taxonomies vs. Composition

<GlossaryTerm definition="Defining a specialized child class via extends that reuses and refines a parent class's contract while initializing parent state with super().">Inheritance</GlossaryTerm> creates a subtype relationship (\`class RateLimitError extends AppError\`) where the child class inherits prototype methods, initializes parent state via \`super(...)\`, and can override behavior while delegating back with \`super.method()\`. Note that a child class does **not** inherit direct access to a parent's \`#private\` fields—it must use the parent's public API.

Reserve inheritance for shallow, genuine *"is-a"* hierarchies (such as typed \`Error\` subclasses). Deep \`extends\` chains create tight coupling (**Fragile Base Class** problem); for sharing capabilities across services, prefer **composition** (*"has-a"*).

<TopicAnchor id="m01-p2-topic-polymorphism" />

#### 8. Polymorphism: Uniform Dispatch Across Interchangeable Types

<GlossaryTerm definition="Allowing different classes or objects implementing the same method contract to be used interchangeably through a shared caller interface.">Polymorphism</GlossaryTerm> (*"many forms"*) lets a single piece of orchestration code work uniformly across multiple implementations without \`if (provider === "stripe") ... else if (provider === "paypal")\` branches. Both \`StripeGateway\` and \`MockGateway\` implement \`.charge(cents)\` and return a consistent receipt shape.

Because JavaScript is dynamically typed, polymorphism works both via shared parent classes (\`extends\`) and via structural **duck typing** (any object exposing the expected method signature). To stay reliable, every polymorphic implementation must honor the same input, output, and error contract.

<TopicAnchor id="m01-p2-topic-solid" />

#### 9. SOLID Fundamentals: Five Guidelines for Modular Change

Coined and popularized by Robert C. Martin, <GlossaryTerm definition="Five object-oriented design principles (SRP, OCP, LSP, ISP, DIP) that keep software modular, extensible, and testable.">SOLID</GlossaryTerm> provides five practical guardrails against rigid, tightly coupled code:

1. **S — Single Responsibility Principle (SRP):** A class or module should serve one cohesive actor/reason to change (keep tax math separate from PDF rendering and SQL persistence).
2. **O — Open/Closed Principle (OCP):** Open for extension, closed for modification—add new variants (discount rules, notification channels) by registering a new class/strategy rather than editing core \`switch\` statements.
3. **L — <GlossaryTerm definition="Subtypes or interchangeable implementations must preserve the caller's expectations around inputs, return shapes, and error behavior.">Liskov Substitution Principle (LSP)</GlossaryTerm>:** Any subtype or strategy implementation must honor the base contract (never throwing unexpected error types or returning incompatible shapes).
4. **I — Interface Segregation Principle (ISP):** Prefer small, focused contracts (\`Readable\`, \`Chargeable\`) over bloated interfaces so callers and test mocks only implement what they actually use.
5. **D — <GlossaryTerm definition="High-level business policy should depend on minimal abstractions/interfaces injected from outside rather than concrete low-level SDKs.">Dependency Inversion Principle (DIP)</GlossaryTerm>:** High-level policy (\`CheckoutService\`) depends on an abstraction (\`PaymentGateway\`), and concrete adapters (\`StripeGateway\`) are injected via constructor parameters rather than imported and instantiated inside core logic.

</TopicSection>

#### 1. V8 Hidden Classes (Maps) & Inline Caches for Objects

In static languages like C++ or Java, the compiler knows the exact byte offset of \`user.email\` at compile time. In JavaScript, objects can gain or lose keys at runtime. To avoid slow hash-table lookups on every property access, V8 builds internal <GlossaryTerm definition="Internal V8 metadata (also called Shapes or Maps) describing an object's property names and byte offsets.">Hidden Classes</GlossaryTerm>:

- When you create \`{ id: 1, name: "A" }\`, V8 creates Hidden Class \`C0\` &rarr; \`C1 (id @ offset 0)\` &rarr; \`C2 (name @ offset 1)\`.
- If another object initializes keys in the **same order** (\`{ id: 2, name: "B" }\`), it shares \`C2\`. V8's **Inline Cache (IC)** remembers \`C2\` and reads \`obj.name\` in one pointer offset check.
- If a third object initializes keys in a **different order** (\`{ name: "C", id: 3 }\`) or dynamically adds \`obj.role = "admin"\` later, it branches into a different Hidden Class tree, turning fast monomorphic reads into slower polymorphic or dictionary lookups.

#### 2. V8 Array Elements Kinds (Packed vs. Holey Transitions)

Standard JS arrays are objects under the hood, but V8 optimizes numeric and dense arrays into contiguous C-style backing stores categorized by **Elements Kinds** *(V8 implementation detail, not an ECMA-262 rule)*:

- \`PACKED_SMI_ELEMENTS\`: Dense array of small 31-bit integers (\`[1, 2, 3]\`) — fastest, unboxed.
- \`PACKED_DOUBLE_ELEMENTS\`: Adding a float (\`arr.push(1.5)\`) downgrades the backing store to unboxed 64-bit floats.
- \`PACKED_ELEMENTS\`: Adding a string or object (\`arr.push("ok")\`) downgrades to generic tagged pointers.
- \`HOLEY_*\`: Leaving gaps (\`[1, , 3]\`, \`arr[500] = 9\`, or \`delete arr[1]\`) marks the array **holey**. Whenever you read a hole, V8 must check \`Array.prototype\` up the prototype chain in case someone defined a property at that index!
- **Crucial rule:** Elements Kind transitions are strictly **one-way** (specific &rarr; generic, packed &rarr; holey). Even if you later remove the string or fill the gap, V8 never upgrades that array back.

#### 3. How ES2015+ Classes & ES2022 \`#private\` Fields Work

Under the hood, an ES2015 \`class\` still creates a constructor function and places instance methods on \`ClassName.prototype\` (covered deeply in M01-P4). However, \`class\` adds critical runtime safeguards over old constructor functions:

- Class bodies run in **strict mode** automatically and cannot be called without \`new\` (throws \`TypeError\`).
- **ES2022 \`#private\` fields** are stored in internal per-instance private slots keyed by the class's lexical brand—not as string keys on the object! They do not appear in \`Object.keys()\`, \`JSON.stringify()\`, or \`for..in\`, and subclasses cannot access a parent's \`#private\` fields directly.

#### 4. Dependency Inversion & Composition Flow

Instead of high-level business logic instantiating concrete SDKs directly, Dependency Inversion reverses the compile-time/import arrow: both high-level policy and low-level adapters depend on a shared minimal contract.

#### Example 1: Objects, \`Object.hasOwn\`, Property Descriptors & \`structuredClone\`

const shallow = { ...original };
shallow.prefs.theme = "dark";

deep.prefs.theme = "light";

<CodeBlock
