#### Example 3: Classes, \`#private\` Encapsulation, Polymorphism & SOLID in Action

<CodeBlock
  lang="javascript"
  runnable
  code={\`// Encapsulation + Abstraction: LedgerAccount enforces non-negative safe-integer invariants with #private fields
class LedgerAccount {
  #balanceCents;
  #entries = [];

  constructor(owner, initialCents = 0) {
    if (typeof owner !== "string" || owner.trim().length === 0) {
      throw new TypeError("owner must be a non-empty string");
    }
    if (!Number.isSafeInteger(initialCents) || initialCents < 0) {
      throw new RangeError("initialCents must be a non-negative safe integer");
    }
    this.owner = owner.trim();
    this.#balanceCents = initialCents;
  }

  deposit(cents) {
    if (!Number.isSafeInteger(cents) || cents <= 0) {
      throw new RangeError("Deposit must be positive integer cents");
    }
    if (!Number.isSafeInteger(this.#balanceCents + cents)) {
      throw new RangeError("Balance would exceed Number.MAX_SAFE_INTEGER");
    }
    this.#balanceCents += cents;
    this.#entries.push({ type: "CREDIT", cents });
  }

  get balanceCents() {
    return this.#balanceCents;
  }

  toJSON() {
    return { owner: this.owner, balanceCents: this.#balanceCents, count: this.#entries.length };
  }
}

// Polymorphism + OCP + DIP: CheckoutService depends only on a charge(cents) strategy
class StripeGateway {
  charge(cents) {
    return { provider: "stripe", ok: true, chargedCents: cents };
  }
}

class MockGateway {
  charge(cents) {
    return { provider: "mock", ok: true, chargedCents: cents };
  }
}

class CheckoutService {
  #gateway;
  constructor(gateway) {
    if (!gateway || typeof gateway.charge !== "function") {
      throw new TypeError("gateway must implement charge(cents)");
    }
    this.#gateway = gateway; // Dependency Inversion: injected abstraction
  }
  pay(account, amountCents) {
    if (!(account instanceof LedgerAccount)) {
      throw new TypeError("account must be a LedgerAccount");
    }
    if (!Number.isSafeInteger(amountCents) || amountCents <= 0) {
      throw new RangeError("amountCents must be a positive safe integer");
    }
    if (!Number.isSafeInteger(account.balanceCents + amountCents)) {
      throw new RangeError("Deposit would exceed Number.MAX_SAFE_INTEGER");
    }
    const receipt = this.#gateway.charge(amountCents);
    if (receipt?.ok) account.deposit(amountCents);
    return receipt;
  }
}

const acct = new LedgerAccount("Maya", 500);
const checkout = new CheckoutService(new MockGateway());
console.log("Receipt:", checkout.pay(acct, 1200));
console.log("JSON view (no #private leak):", JSON.stringify(acct));\`}
/>

#### Example 4: Inheritance (\`extends\`, \`super\`), \`#private\` Isolation & Liskov Substitution

<CodeBlock
  lang="javascript"
  runnable
  code={\`// Shallow "is-a" inheritance taxonomy with super() and uniform LSP contract
class AppError extends Error {
  #httpStatus;
  constructor(message, httpStatus = 500) {
    if (typeof message !== "string" || message.trim().length === 0) {
      throw new TypeError("Error message must be a non-empty string");
    }
    if (!Number.isInteger(httpStatus) || httpStatus < 400 || httpStatus > 599) {
      throw new RangeError("httpStatus must be an HTTP 4xx/5xx status code");
    }
    super(message);
    this.name = new.target.name;
    this.#httpStatus = httpStatus;
  }
  get httpStatus() {
    return this.#httpStatus; // Subclasses use public getter; parent #private stays isolated
  }
  toClientPayload() {
    return { error: this.name, message: this.message, status: this.#httpStatus, retryable: false };
  }
}

class RateLimitError extends AppError {
  constructor(retryAfterSec) {
    if (!Number.isInteger(retryAfterSec) || retryAfterSec <= 0) {
      throw new RangeError("retryAfterSec must be a positive integer");
    }
    super("Rate limit exceeded", 429);
    this.retryAfterSec = retryAfterSec;
  }
  toClientPayload() {
    // Extends parent contract via super.toClientPayload() while preserving LSP shape
    return { ...super.toClientPayload(), retryable: true, retryAfterSec: this.retryAfterSec };
  }
}

const err = new RateLimitError(30);
console.log("instanceof AppError & Error:", err instanceof AppError, err instanceof Error);
console.log("Client payload:", err.toClientPayload());\`}
/>

#### Example 5: SOLID — Single Responsibility (SRP) & Interface Segregation (ISP)

<CodeBlock
  lang="javascript"
  runnable
  code={\`// SRP: Separate pure invoice math, formatting, and storage into single-purpose collaborators
class InvoiceCalculator {
  subtotalCents(items) {
    if (!Array.isArray(items) || items.length === 0) {
      throw new TypeError("items must be a non-empty array");
    }
    return items.reduce((sum, item) => {
      if (!item || !Number.isSafeInteger(item.unitCents) || item.unitCents < 0) {
        throw new TypeError("unitCents must be a non-negative safe integer");
      }
      if (!Number.isSafeInteger(item.qty) || item.qty <= 0) {
        throw new TypeError("qty must be a positive safe integer");
      }
      const next = sum + item.unitCents * item.qty;
      if (!Number.isSafeInteger(next)) throw new RangeError("Subtotal overflow");
      return next;
    }, 0);
  }
}

class InvoiceFormatter {
  toSummaryText(invoiceId, totalCents) {
    if (typeof invoiceId !== "string" || invoiceId.trim().length === 0) {
      throw new TypeError("invoiceId must be a non-empty string");
    }
    if (!Number.isSafeInteger(totalCents) || totalCents < 0) {
      throw new RangeError("totalCents must be a non-negative safe integer");
    }
    return \\\`Invoice \\\${invoiceId}: $\\\${(totalCents / 100).toFixed(2)}\\\`;
  }
}

// ISP: Small, segregated contracts so read-only consumers don't depend on write/refund methods
function createReadOnlyAuditView(ledgerReader) {
  if (!ledgerReader || typeof ledgerReader.getBalanceCents !== "function") {
    throw new TypeError("ledgerReader must implement getBalanceCents()");
  }
  return {
    snapshot() {
      return { balanceCents: ledgerReader.getBalanceCents() };
    }
  };
}

const calc = new InvoiceCalculator();
const fmt = new InvoiceFormatter();
const total = calc.subtotalCents([{ unitCents: 1250, qty: 2 }, { unitCents: 500, qty: 1 }]);
const auditView = createReadOnlyAuditView({ getBalanceCents: () => total });
console.log(fmt.toSummaryText("INV-101", total));
console.log("ISP read-only snapshot:", auditView.snapshot());\`}
/>

#### Example 6: \`WeakMap\` & \`WeakSet\` for Leak-Free Object Metadata

<CodeBlock
  lang="javascript"
  runnable
  code={\`// WeakMap attaches per-object metadata without mutating the object or leaking memory after GC
const requestTimings = new WeakMap();
const processedPayloads = new WeakSet();

function tagRequest(req, startedAtMs) {
  if (!req || typeof req !== "object") {
    throw new TypeError("WeakMap/WeakSet keys must be objects");
  }
  if (!Number.isFinite(startedAtMs) || startedAtMs < 0) {
    throw new RangeError("startedAtMs must be a non-negative finite number");
  }
  requestTimings.set(req, { startedAtMs });
  return requestTimings.get(req);
}

function markProcessedOnce(payload) {
  if (!payload || typeof payload !== "object") {
    throw new TypeError("payload must be an object");
  }
  if (processedPayloads.has(payload)) return false;
  processedPayloads.add(payload);
  return true;
}

const reqObj = { path: "/api/orders" };
console.log("Timing tagged:", tagRequest(reqObj, 120));
console.log("First process:", markProcessedOnce(reqObj), "| Duplicate process:", markProcessedOnce(reqObj));\`}
/>

</TopicSection>

<TopicSection id="m01-p2-sec-e" letter="E" title="Step-by-Step Walkthrough">

Trace every step of **Example 3** (\`LedgerAccount\` + \`CheckoutService\`):

1. **Instantiation (\`new LedgerAccount("Maya", 500)\`):** V8 allocates a \`LedgerAccount\` instance on the heap, runs \`constructor\`, validates non-empty \`owner\` and non-negative safe-integer \`initialCents\`, sets public \`this.owner = "Maya"\`, and initializes private internal slots \`#balanceCents = 500\` and \`#entries = []\`.
2. **Encapsulation & Overflow Guarantee:** External code cannot execute \`acct.#balanceCents = 999999\` (parse-time \`SyntaxError\`) or mutate \`acct.#entries.push(...)\`. Only \`deposit()\` can change \`#balanceCents\`, enforcing both positive safe-integer checks and \`MAX_SAFE_INTEGER\` overflow protection.
3. **Dependency Injection (\`new CheckoutService(new MockGateway())\`):** \`CheckoutService\` validates that the injected dependency implements \`.charge(cents)\` and stores it inside \`#gateway\` without importing a concrete Stripe SDK (**DIP**).
4. **Pre-Charge Validation & Polymorphic Dispatch:** Before touching \`this.#gateway.charge(amountCents)\`, \`pay()\` validates \`account instanceof LedgerAccount\`, positive safe-integer \`amountCents\`, and overflow bounds so invalid inputs never charge a real payment gateway. Then it calls \`.charge(1200)\` uniformly across \`StripeGateway\`, \`MockGateway\`, or any compliant adapter (**Polymorphism** & **OCP**).
5. **Safe Serialization (\`JSON.stringify(acct)\`):** Because \`toJSON()\` is defined explicitly and \`#private\` slots are hidden from enumeration, only the safe public summary \`{ owner, balanceCents, count }\` is serialized.

</TopicSection>

<TopicSection id="m01-p2-sec-f" letter="F" title="Real-World Use Cases">

#### Scenario 1: Multi-Gateway Billing Service (Abstraction, Polymorphism, OCP & DIP)

**Problem:** An e-commerce backend starts with Stripe inside \`processOrder()\`. Six months later, adding PayPal and local bank transfers turns \`processOrder()\` into a 400-line \`switch\` statement where testing requires hitting real Stripe sandboxes.

**Production Solution:** Extract a minimal \`PaymentProvider\` interface (\`charge\`, \`refund\`) and inject implementations via a \`Map<string, PaymentProvider>\` registry. Core \`OrderService\` logic stays unchanged when adding providers (**OCP**), and unit tests inject an in-memory double (**DIP**).

#### Scenario 2: Immutable State Trees in React & Node.js Config Mergers

**Problem:** A React dashboard filters and sorts a user's \`orders\` prop using \`orders.sort(...)\`. Because \`.sort()\` mutates in place, React's shallow reference check (\`prevOrders === nextOrders\`) thinks nothing changed, skipping re-renders while silently scrambling parent state.

**Production Solution:** Use non-mutating transformations (\`orders.toSorted(...)\` or \`[...orders].sort(...)\`) and immutable object updates (\`{ ...state, user: { ...state.user, name } }\`) so references change cleanly along modified paths.

</TopicSection>

<TopicSection id="m01-p2-sec-g" letter="G" title="Common Mistakes">

- **Mutating arrays with \`.sort()\`, \`.reverse()\`, or \`.splice()\`** on props/state or omitting numeric comparators (\`[10, 2].sort()\` sorting as strings).
- **Using \`delete arr[index]\`**: Leaves sparse empty slots (\`HOLEY_ELEMENTS\`) while keeping \`arr.length\` unchanged. Use \`.splice()\` or \`.filter()\` instead.
- **Confusing shallow spread (\`{ ...obj }\`) with deep cloning**: Mutating nested properties still mutates the original object.
- **Overusing deep inheritance (\`class Manager extends Employee extends Person extends Entity\`)**: Tightly couples subclasses to parent internals (Fragile Base Class problem) and often violates **Liskov Substitution** (e.g., \`Square extends Rectangle\` breaking independent \`setWidth\`/\`setHeight\` assumptions).
- **Using plain \`{}\` as a dynamic dictionary for arbitrary keys**: User-supplied keys like \`"constructor"\` or \`"toString"\` collide with \`Object.prototype\` methods. Prefer \`new Map()\`.
- **Treating SOLID as a mandate for excessive boilerplate**: Wrapping a 10-line helper in five interfaces and abstract factories violates YAGNI.

</TopicSection>

<TopicSection id="m01-p2-sec-h" letter="H" title="Best Practices">

- **Favor composition ("has-a") over inheritance ("is-a"):** Compose small behaviors (\`retryPolicy\`, \`logger\`, \`gateway\`) via constructor injection instead of multi-level \`extends\` chains.
- **Use \`#private\` class fields for genuine invariants** (account balances, state machines, secret clients) and expose clean getters/methods.
- **Use \`Object.hasOwn(obj, key)\`** for own-property checks and **\`Map\` / \`Set\`** for dynamic collections with frequent additions/deletions.
- **Keep object shapes consistent** (initialize all fields in the same order, set optional fields to \`null\`/\`undefined\` upfront rather than adding them conditionally later).
- **Prefer non-mutating array operations** (\`map\`, \`filter\`, \`toSorted\`, \`toReversed\`, \`toSpliced\`) at application state boundaries.
- **Apply SOLID where change happens:** Split responsibilities when modules serve different actors (**SRP**), and introduce interfaces (**OCP/DIP**) at external I/O or multi-variant boundaries.

</TopicSection>

<TopicSection id="m01-p2-sec-i" letter="I" title="Performance & Scalability">

- **\`Object\` vs. \`Map\` at Scale:** Plain objects with static shapes optimize well for fixed-schema records (V8 Hidden Classes). \`Map\` is optimized for dynamic dictionaries with frequent key insertions/deletions and avoids prototype chain checks.
- **Preventing Memory Leaks with \`WeakMap\` / \`WeakSet\`:** Storing request or DOM-node metadata in a global \`Map\` or \`Set\` keeps strong references alive forever unless manually deleted. \`WeakMap\` and \`WeakSet\` allow the Garbage Collector to reclaim entries automatically once the key object is no longer referenced elsewhere.
- **Array Operation Complexity:** \`.push()\` and \`.pop()\` at the tail are amortized \`O(1)\`. \`.shift()\` and \`.unshift()\` at index \`0\` re-index every element (\`O(n)\`), becoming a bottleneck on queues of 50,000+ items (use a ring buffer or head-index pointer instead).
- **Keep Hot Arrays Dense & Homogeneous:** Avoid mixing integers, floats, and strings or leaving sparse holes in tight numeric loops so V8 stays in \`PACKED_SMI\` / \`PACKED_DOUBLE\` storage.
- **\`structuredClone\` Cost:** Deep cloning huge nested payloads on every request allocates significant heap memory. Clone only at untrusted boundaries or use structural sharing for incremental updates.

</TopicSection>

<TopicSection id="m01-p2-sec-j" letter="J" title="Security Considerations">

- **<GlossaryTerm definition="An injection flaw where untrusted __proto__, constructor, or prototype keys in recursive object merges mutate Object.prototype globally.">Prototype Pollution</GlossaryTerm> (\`__proto__\`, \`constructor\`, \`prototype\`):** Never merge untrusted objects recursively without blocking \`"__proto__"\`, \`"constructor"\`, and \`"prototype"\` keys and checking \`Object.hasOwn(src, key)\`. Polluting \`Object.prototype\` affects every object in a Node.js server!
- **Dynamic Property Lookup Injection:** Avoid \`handlers[userInput]()\` on a plain object—if \`userInput === "toString"\`, it invokes \`Object.prototype.toString\` or throws unexpectedly. Use \`handlersMap.get(userInput)\` with a \`Map\`.
- **Accidental Secret Leakage in Serialization:** Plain public properties like \`user._passwordHash\` are included by \`JSON.stringify(user)\`. Keep sensitive fields \`#private\` or return explicit DTOs / \`toJSON()\` outputs.
- **Freezing Shared Configuration:** Call \`Object.freeze()\` (or recursive deep freeze) on startup configuration objects so buggy plugins cannot mutate shared runtime settings.

</TopicSection>

<TopicSection id="m01-p2-sec-k" letter="K" title="Comparisons & Decision Tables">

#### 1. Plain \`Object\` vs. \`Map\` vs. \`Set\` vs. \`WeakMap\` / \`WeakSet\`

| Criterion | Plain \`Object\` | \`Map\` | \`Set\` | \`WeakMap\` / \`WeakSet\` |
| --- | --- | --- | --- | --- |
| Key / element types | \`string\` and \`Symbol\` only | Any value (objects, functions, primitives) | Unique values of any type | Objects (and non-registered \`Symbol\`s) only |
| Prototype collisions | Inherits \`Object.prototype\` (use \`Object.hasOwn\`) | None (clean key space) | None | None |
| GC & Memory behavior | Strong references (manual delete) | Strong references (manual \`.delete()\`) | Strong references (manual \`.delete()\`) | **Weak** references (auto-reclaimed by GC) |
| Size & iteration | \`Object.keys(o).length\` (\`O(n)\`) | \`map.size\` (\`O(1)\`), iterable | \`set.size\` (\`O(1)\`), iterable | Not enumerable (no \`.size\`, no \`for..of\`) |
| Best fit | Fixed-shape records, DTOs, JSON payloads | Dynamic dictionaries, caches, frequent add/delete | Deduplication, \`O(1)\` membership tests | Per-object private metadata, visited-object tracking |

#### 2. Shallow vs. Deep Copying Strategies

| Strategy | Depth | Circular Refs | Special Types (\`Date\`, \`Map\`, \`Set\`, \`BigInt\`, \`fn\`) | Cost & Best Fit |
| --- | --- | --- | --- | --- |
| \`{ ...obj }\`, \`Object.assign()\`, \`[...arr]\` | **Shallow** (top-level only) | Preserves top-level refs | Copies references as-is | \`O(k)\` fast; React/Redux structural sharing |
| \`JSON.parse(JSON.stringify(x))\` | Deep (JSON subset) | **Throws** \`TypeError\` | Drops \`undefined\`/\`fn\`/\`Symbol\`; stringifies \`Date\`; throws on \`BigInt\` | Slowest & lossy; avoid for rich JS objects |
| \`structuredClone(x)\` (Node 17+ / modern browsers) | **Deep** | **Supported** | Preserves \`Date\`, \`Map\`, \`Set\`, \`RegExp\`, \`BigInt\`; **throws** on \`fn\`/\`Symbol\`/DOM | Allocates full deep copy; untrusted/isolated snapshots |
| Structural sharing (\`{ ...s, nested: { ...s.nested } }\`) | Selective paths | Manual | Preserves everything along unchanged branches | Best balance of immutability & GC efficiency |

#### 3. Composition vs. Inheritance

| Dimension | Composition (*Has-A*) | Inheritance (*Is-A*) |
| --- | --- | --- |
| Coupling | Loose (depends on small public contract) | Tight (coupled to parent internals/lifecycle) |
| Runtime flexibility | Swap behaviors dynamically via constructor/props | Fixed class hierarchy at definition time |
| Multiple capabilities | Combine any number of collaborators cleanly | JS supports single \`extends\` only |
| Best fit | Services, plugins, UI patterns, retry/auth policies | Shallow taxonomies (e.g., custom \`AppError extends Error\`) |

#### 4. SOLID Principles Quick Decision Guide

| Principle | Core Question | Warning Sign of Violation |
| --- | --- | --- |
| **S**RP | Does this module change for one reason/actor? | A class mixes SQL queries, pricing math, and HTML formatting |
| **O**CP | Can we add a variant without editing core code? | A 10-branch \`switch (provider)\` duplicated across files |
| **L**SP | Can any subtype replace the base seamlessly? | Subclass throws \`NotImplementedError\` or changes return shape |
| **I**SP | Are callers forced to depend on unused methods? | A mock needs 15 dummy methods just to test 1 read call |
| **D**IP | Does domain logic depend on abstractions, not SDKs? | Business logic directly imports \`mysql2\` or \`stripe\` |

</TopicSection>

<TopicSection id="m01-p2-sec-l" letter="L" title="Tips to Remember (Mnemonics & Mental Models)">

- **OOP Pillars — \`A-P-I-E\`:** **A**bstraction (hide complexity), **P**olymorphism (one interface, many forms), **I**nheritance (is-a specialization), **E**ncapsulation (protect invariants with \`#private\`).
- **\`SOLID\` 5-Word Summary:** **S**ingle reason, **O**pen to extend, **L**iskov substitutable, **I**nterfaces small, **D**epend on abstractions.
- **Array Safety Rule:** *"Sort mutates & stringifies; \`toSorted((a, b) => a - b)\` stays pure & numeric."*
- **Prototype Pollution Shield:** *"Plain \`{}\` shares a family tree; \`Map\` and \`Object.hasOwn\` keep strangers out."*
- **V8 Speed Rule:** *"Same key order on objects, no holes in arrays."*

</TopicSection>

<TopicSection id="m01-p2-sec-o" letter="O" title="Practical Exercises">

<ExerciseCard
  title="Exercise 1: Prototype-Pollution-Safe Config Merger"
  prompt={
    <p>
      Write <code>safeMerge(base, override)</code> that validates both arguments as plain objects, creates a shallow-isolated copy merging own properties of <code>base</code> and <code>override</code>, and explicitly blocks <code>__proto__</code>, <code>constructor</code>, and <code>prototype</code> keys plus inherited prototype properties.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`const FORBIDDEN_KEYS = new Set(["__proto__", "constructor", "prototype"]);

function isPlainObject(value) {
  return value !== null && typeof value === "object" && Object.prototype.toString.call(value) === "[object Object]";
}

function safeMerge(base, override) {
  if (!isPlainObject(base) || !isPlainObject(override)) {
    throw new TypeError("Both base and override must be non-null plain objects");
  }
  const result = {};
  for (const src of [base, override]) {
    for (const key in src) {
      if (!Object.hasOwn(src, key)) continue;
      if (FORBIDDEN_KEYS.has(key)) continue;
      result[key] = src[key];
    }
  }
  return result;
}

const malicious = JSON.parse('{"theme":"dark","__proto__":{"isAdmin":true}}');
const merged = safeMerge({ theme: "light", timeoutMs: 3000 }, malicious);
console.log("Merged:", merged);
console.log("Prototype polluted?", merged.isAdmin === true || ({}).isAdmin === true); // false\`}
  />
</ExerciseCard>

<ExerciseCard
  title="Exercise 2: Non-Mutating Array Analytics Pipeline"
  prompt={
    <p>
      Given an array of order objects <code>{\`{ id, amountCents, status }\`}</code>, write a pure function <code>topPaidOrders(orders, limit)</code> that validates inputs, filters <code>"PAID"</code> orders, sorts descending by <code>amountCents</code> without mutating the input array, and returns the top <code>limit</code> items.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`function topPaidOrders(orders, limit = 3) {
  if (!Array.isArray(orders)) {
    throw new TypeError("orders must be an array");
  }
  if (!Number.isInteger(limit) || limit < 0) {
    throw new RangeError("limit must be a non-negative integer");
  }
  return orders
    .filter((o) => {
      if (!o || typeof o !== "object") throw new TypeError("Invalid order item");
      if (o.status === "PAID" && !Number.isFinite(o.amountCents)) {
        throw new TypeError("Paid order amountCents must be a finite number");
      }
      return o.status === "PAID";
    })
    .toSorted((a, b) => b.amountCents - a.amountCents)
    .slice(0, limit);
}

const orders = [
  { id: "o1", amountCents: 1200, status: "PAID" },
  { id: "o2", amountCents: 9900, status: "PENDING" },
  { id: "o3", amountCents: 4500, status: "PAID" },
  { id: "o4", amountCents: 2100, status: "PAID" }
];
console.log("Top 2 paid:", topPaidOrders(orders, 2));
console.log("Original first item untouched:", orders[0].id);\`}
  />
</ExerciseCard>

<ExerciseCard
  title="Exercise 3: Refactoring Switch Logic to SOLID (OCP + DIP)"
  prompt={
    <p>
      Refactor a hardcoded <code>if/else</code> discount calculator into a <code>Map</code>-based strategy registry where new discount rules register without modifying <code>PriceCalculator</code> and obey Liskov Substitution return invariants.
    </p>
  }
>
  <CodeBlock
    lang="javascript"
    runnable
    code={\`class PriceCalculator {
  #strategies = new Map();

  register(code, fn) {
    if (typeof code !== "string" || code.trim().length === 0) {
      throw new TypeError("Discount code must be a non-empty string");
    }
    if (typeof fn !== "function") {
      throw new TypeError("Discount strategy must be a function");
    }
    this.#strategies.set(code, fn);
  }

  apply(code, subtotalCents) {
    if (typeof code !== "string" || code.trim().length === 0) {
      throw new TypeError("Discount code must be a non-empty string");
    }
    if (!Number.isSafeInteger(subtotalCents) || subtotalCents < 0) {
      throw new RangeError("subtotalCents must be a non-negative safe integer");
    }
    const strategy = this.#strategies.get(code);
    if (!strategy) throw new Error(\\\`Unknown discount code: \\\${code}\\\`);
    const finalCents = strategy(subtotalCents);
    if (!Number.isSafeInteger(finalCents) || finalCents < 0 || finalCents > subtotalCents) {
      throw new RangeError("Strategy violated LSP postcondition: invalid cents result");
    }
    return finalCents;
  }
}

const calc = new PriceCalculator();
calc.register("FLAT500", (cents) => Math.max(0, cents - 500));
calc.register("PCT10", (cents) => Math.round(cents * 0.9));

console.log("FLAT500 on 3000:", calc.apply("FLAT500", 3000));
console.log("PCT10 on 3000:", calc.apply("PCT10", 3000));\`}
  />
</ExerciseCard>

<TopicSection id="m01-p2-sec-p" letter="P" title="Advanced Challenge">

<Callout variant="warn" title="Senior Challenge: Plugin-Safe Extensible Rules Engine">
  <p>
    You are building a multi-tenant Node.js webhook engine where tenants define custom filter rules in JSON and plugins register custom transformation steps.

    <strong>Your Task:</strong> Explain how you combine (1) <strong>Encapsulation</strong> (<code>#private</code> state) to isolate tenant execution contexts, (2) <strong>OCP + DIP</strong> via a <code>Map</code>-backed plugin registry, (3) <strong>Liskov Substitution</strong> on plugin return contracts, and (4) defense against <strong>Prototype Pollution</strong> and accidental mutation of shared event payloads across plugins.
  </p>
</Callout>

<ExerciseCard
  title="Reference Architecture Notes"
  prompt={null}
  buttonLabel="Reveal Approach"
  hideLabel="Hide Approach"
>
  <ol>
    <li>Isolate per-tenant execution inside an encapsulated <code>TenantPipeline</code> class storing secrets/quotas in <code>#private</code> fields and exposing only <code>execute(event)</code>.</li>
    <li>Store registered plugin handlers in a <code>new Map()</code> (never a plain object) so tenant rule names like <code>"constructor"</code> cannot invoke prototype properties.</li>
    <li>Clone or freeze incoming event objects (<code>Object.freeze</code> / <code>structuredClone</code> per plugin step) so one buggy plugin cannot mutate payloads read by subsequent plugins.</li>
    <li>Enforce a uniform Liskov-compliant plugin contract (<code>&#123; status: "ok", payload &#125; | &#123; status: "skip", reason &#125;</code>) and block <code>__proto__</code>/<code>constructor</code>/<code>prototype</code> keys at JSON ingestion.</li>

<TopicSection id="m01-p2-sec-q" letter="Q" title="Summary & Key Takeaways">

- **Objects & Arrays** are heap-allocated reference types: prefer \`Object.hasOwn()\`, \`structuredClone()\` for deep isolation, \`Map\`/\`Set\` for dynamic keys, and non-mutating array transforms (\`toSorted\`, \`filter\`, \`map\`).
- **V8 Performance Mental Model:** Keep object property initialization orders consistent (Hidden Classes) and keep arrays dense and type-homogeneous (avoiding one-way \`HOLEY\` downgrades).
- **OOP Pillars (\`A-P-I-E\`):** Use ES2022 \`#private\` fields for true encapsulation, clean interfaces for abstraction and polymorphism, and **composition over inheritance** for flexibility.
- **SOLID Pragmatically:** Separate unrelated actors (**SRP**), extend via registries/strategies (**OCP**), keep subtypes contract-compatible (**LSP**), keep interfaces small (**ISP**), and inject low-level dependencies (**DIP**).

</TopicSection>
`,se=[{id:`m01-p1-iq-1`,lessonId:`m01-p1`,moduleNumber:1,number:1,difficulty:`basic`,question:"What is the difference between `null` and `undefined` in JavaScript?",paragraphs:[{label:`Explanation:`,body:'`undefined` means a variable has been declared, a property is missing, or a function has no explicit `return`—the runtime supplies it automatically as "not yet assigned." `null` is an explicit assignment value representing the intentional absence of an object or value.'},{label:`Trap:`,body:'`typeof undefined === "undefined"`, while `typeof null === "object"` (a legacy 1995 bit-tag quirk). Also `null == undefined` is `true`, whereas `null === undefined` is `false`.'}],subboxes:[{title:`Example`,content:"`let a; // undefined` | `let b = null; // explicitly empty`",isCode:!0},{title:`Follow-up & Tip`,content:"*Follow-up:* How does JSON handle both? `JSON.stringify` keeps `null` properties and drops `undefined` object properties."}]},{id:`m01-p1-iq-2`,lessonId:`m01-p1`,moduleNumber:1,number:2,difficulty:`basic`,question:"What is the difference between `var`, `let`, and `const`?",paragraphs:[{label:`Explanation:`,body:"`var` is function-scoped, allows redeclaration, and is hoisted with an initial value of `undefined`. `let` and `const` are block-scoped, forbid redeclaration in the same scope, and remain uninitialized in the Temporal Dead Zone (TDZ) until their declaration line executes. `const` additionally forbids reassigning the variable binding, though objects referenced by a `const` binding can still be mutated."}],subboxes:[{title:`Follow-up Question`,content:"Does `const arr = [1, 2]; arr.push(3);` throw an error? No—`arr` still points to the same array reference."},{title:`Interview Tip`,content:"Emphasize that `const` guarantees binding immutability, not deep data immutability (`Object.freeze` handles shallow property freezing)."}]},{id:`m01-p1-iq-3`,lessonId:`m01-p1`,moduleNumber:1,number:3,difficulty:`basic`,question:`What are the data types in JavaScript, and how do primitives differ from objects?`,paragraphs:[{label:`Explanation:`,body:"JavaScript has 8 data types: 7 primitives (`string`, `number`, `bigint`, `boolean`, `undefined`, `null`, `symbol`) and 1 reference type (`object`, which includes arrays and functions). Primitives are immutable and compared/copied by value; objects are mutable and compared/copied by reference."}],subboxes:[{title:`Example`,content:'`"abc".toUpperCase()` returns a new string; the original string cannot be altered in place.'},{title:`Interview Tip`,content:'Remember `BigInt` (ES2020) and `Symbol` (ES2015)—many candidates forget them and say "6 types."'}]},{id:`m01-p1-iq-4`,lessonId:`m01-p1`,moduleNumber:1,number:4,difficulty:`basic`,question:"What is the difference between `==` and `===`?",paragraphs:[{label:`Explanation:`,body:'`===` (strict equality) checks both type and value without type coercion (returning `false` immediately if types differ). `==` (abstract equality) performs multi-step implicit type coercion when operands have different types (e.g., converting strings/booleans to numbers), producing counterintuitive results like `"" == 0` or `[] == false`.'}],subboxes:[{title:`Follow-up Question`,content:"How does `Object.is(a, b)` differ from `===`? `Object.is(NaN, NaN)` is `true` and `Object.is(+0, -0)` is `false`."},{title:`Interview Tip`,content:"Always recommend `===` by default in production codebases enforced via ESLint (`eqeqeq`)."}]},{id:`m01-p1-iq-5`,lessonId:`m01-p1`,moduleNumber:1,number:5,difficulty:`intermediate`,question:"Why does `0.1 + 0.2 !== 0.3` in JavaScript, and how do you handle money safely?",paragraphs:[{label:`Explanation:`,body:"JavaScript numbers are 64-bit IEEE-754 binary floats. Just as `1/3` cannot be represented finitely in base-10, `0.1` (`1/10`) and `0.2` (`1/5`) are infinite repeating fractions in base-2. Rounding to 53 mantissa bits produces `0.30000000000000004` when added."},{label:`Practical Solutions:`,body:"(1) Store money in integer minor units (cents) and compute using integers; (2) for arbitrary-precision decimals (tax rates, crypto, FX), use a decimal library such as `decimal.js` or `big.js`; (3) for scientific float comparisons, compare `Math.abs(a - b) < Number.EPSILON` (scaled by magnitude)."}],subboxes:[{title:`Follow-up`,content:`How do you round currency at tax time? Use integer arithmetic with deterministic rounding (e.g., half-even / banker's rounding when required by accounting rules).`},{title:`Interview Tip`,content:'Mention that this is not a "JS bug"—Python, Java `double`, and Go `float64` behave identically under IEEE-754.'}]},{id:`m01-p1-iq-6`,lessonId:`m01-p1`,moduleNumber:1,number:6,difficulty:`intermediate`,question:`Is JavaScript pass-by-value or pass-by-reference? Explain with an example.`,paragraphs:[{label:`Explanation:`,body:"Strictly speaking, JavaScript is always **pass-by-value**, often termed **pass-by-sharing** for objects. For primitives, the value itself is copied into the parameter. For objects, the *reference value (pointer)* is copied into the parameter. Therefore, mutating a property (`param.x = 2`) affects the caller's object because both pointers target the same heap object, whereas reassigning the parameter (`param = { x: 2 }`) only rebinds the local parameter and leaves the caller unchanged."}],subboxes:[{title:`Follow-up`,content:"How do you prevent a function from mutating caller data? Clone at the boundary (`structuredClone` or shallow spread `{ ...obj }` for flat updates)."},{title:`Interview Tip`,content:"Contrasting true pass-by-reference (like C++ `int& x` where reassigning `x` changes the caller variable) proves deep clarity."}]},{id:`m01-p1-iq-7`,lessonId:`m01-p1`,moduleNumber:1,number:7,difficulty:`intermediate`,question:"Explain the Temporal Dead Zone (TDZ) and why `let`/`const` still hoist.",paragraphs:[{label:`Explanation:`,body:"Both `let` and `const` are hoisted to the top of their enclosing block during scope creation—meaning the engine knows the identifier exists in that block and shadows any outer variable of the same name. However, unlike `var` (initialized to `undefined`), `let`/`const` remain *uninitialized* in the TDZ until execution reaches their declaration statement. Reading them in the TDZ throws a `ReferenceError`—even `typeof x` throws inside the TDZ!"}],subboxes:[{title:`Code Proof`,content:"`let x = 1; { console.log(x); let x = 2; } // ReferenceError, NOT 1!`",isCode:!0},{title:`Interview Tip`,content:"Point out that the inner `let x` shadows the outer `x` from the start of the block—proving `let` is hoisted."}]},{id:`m01-p1-iq-8`,lessonId:`m01-p1`,moduleNumber:1,number:8,difficulty:`intermediate`,question:`What is a pure function, and why do React and backend pipelines care about purity?`,paragraphs:[{label:`Explanation:`,body:"A pure function (1) always returns the same output for the same inputs (deterministic) and (2) causes no observable side effects (no mutating inputs/globals, no network/disk I/O, no `Date.now()`/`Math.random()`). Purity enables trivial unit testing without mocks, safe concurrency, memoization (caching by input), and predictable React rendering where shallow reference checks detect state updates."}],subboxes:[{title:`Follow-up`,content:`Can an entire app be pure? No—real apps need DB writes and HTTP calls. Push side effects to thin I/O shells around a pure core ("Functional Core, Imperative Shell").`},{title:`Interview Tip`,content:"Give a concrete example: `Array.prototype.sort()` mutates in place (impure), whereas `toSorted()` returns a new array (pure)."}]},{id:`m01-p1-iq-9`,lessonId:`m01-p1`,moduleNumber:1,number:9,difficulty:`advanced`,question:`How does V8 internally represent numbers vs. objects, and why can mixing types slow down a hot function?`,paragraphs:[{label:`Explanation:`,body:"V8 uses pointer tagging to avoid heap-allocating every small integer. Small signed integers (Smi) are encoded directly in the pointer word with a tag bit, while floats and integers outside the Smi range are heap-allocated as `HeapNumber` objects. Similarly, objects share internal Hidden Classes (Maps) describing property offsets. When TurboFan JIT compiles a hot function, it specializes machine code for the observed Smi/object shapes (monomorphic). If later calls pass a string or differently shaped object, the type guard fails, causing deoptimization back to Ignition bytecode and megamorphic slow-path lookups."}],subboxes:[{title:`Follow-up`,content:`How do you keep shapes consistent? Initialize all object properties in the same order in constructors/factories instead of adding properties dynamically later.`},{title:`Interview Tip`,content:`Note clearly that Smi/Hidden Class details are V8 engine optimizations—not guarantees of the ECMAScript specification.`}]},{id:`m01-p1-iq-10`,lessonId:`m01-p1`,moduleNumber:1,number:10,difficulty:`advanced`,question:"Why does `Number.MAX_SAFE_INTEGER + 1 === Number.MAX_SAFE_INTEGER + 2` evaluate to `true`, and how does this break distributed systems?",paragraphs:[{label:`Explanation:`,body:"IEEE-754 double precision has 53 bits of significand precision (`2^53 - 1 = 9,007,199,254,740,991`). At `2^53`, the spacing between representable floats jumps from `1` to `2`, so odd numbers like `2^53 + 1` cannot be represented and round to `2^53`. In distributed systems using 64-bit Snowflake IDs (Twitter/Discord style) or PostgreSQL `BIGINT` sequences, `JSON.parse` converts numeric literals into JS `Number`, silently corrupting IDs—two distinct records collide to the same ID."}],subboxes:[{title:`Mitigation`,content:'Serialize 64-bit IDs as JSON strings (`"id": "9007199254740993"`) or use `BigInt` internally with custom JSON revivers/serializers.'},{title:`Interview Tip`,content:"Mention `Number.isSafeInteger(val)` as an essential validation guard on numeric IDs."}]},{id:`m01-p1-iq-11`,lessonId:`m01-p1`,moduleNumber:1,number:11,difficulty:`advanced`,question:`Does JavaScript support Proper Tail Calls (TCO) in production, and how do you avoid call-stack overflow on deep data?`,paragraphs:[{label:`Explanation:`,body:"Although ES2015 specified Proper Tail Calls in strict mode, major engines diverged: JavaScriptCore (Safari) implemented it, whereas V8 (Chrome/Node.js) and SpiderMonkey (Firefox) did not enable it due to stack-trace debugging concerns and low real-world ROI. Therefore, you **cannot** rely on tail recursion for unbounded inputs in Node.js or cross-browser apps—at ~10k+ depth, the call stack throws `RangeError`."},{label:`Production Alternatives:`,body:"Rewrite recursion into an iterative loop with an explicit heap-allocated array stack/queue (`while (stack.length)`), or use a trampoline pattern (returning thunks) when recursive style is needed."}],subboxes:[{title:`Follow-up`,content:`Why is an explicit heap stack safer than the call stack? Heap capacity scales to hundreds of MBs/GBs, whereas the call stack is typically a few MBs.`},{title:`Interview Tip`,content:`Calling out the spec vs. V8 reality is a classic senior differentiator.`}]},{id:`m01-p1-iq-12`,lessonId:`m01-p1`,moduleNumber:1,number:12,difficulty:`advanced`,question:"Explain how JavaScript's abstract type coercion (`ToPrimitive`, `ToNumber`, `ToBoolean`) leads to subtle bugs and security flaws.",paragraphs:[{label:`Explanation:`,body:'When operators like `+`, `==`, or relational `<` encounter mismatched types, the spec invokes internal abstract operations: `ToPrimitive` calls `[Symbol.toPrimitive]`, `valueOf()`, then `toString()`. Meanwhile `+` prefers string concatenation if either operand becomes a string, whereas `-`/`*`/`<` convert to numbers (e.g., `[] + {} === "[object Object]"`, `Number([]) === 0`, `Number(null) === 0`, `Number(undefined) === NaN`). If an auth or rate-limit check relies on `if (limit > 0)` or loose equality against unvalidated JSON/query parameters, unexpected arrays or empty strings silently coerce to `0` or `true`.'}],subboxes:[{title:`Defense`,content:"Validate exact runtime types at ingress using strict schemas (e.g., Zod) and disable implicit coercion via `===` + TypeScript strict mode."},{title:`Follow-up`,content:"What does `null >= 0` vs `null == 0` evaluate to? `null >= 0` is `true` (`ToNumber(null) === 0`), while `null == 0` is `false` (special spec rule for `null`/`undefined`)."}]},{id:`m01-p1-iq-13`,lessonId:`m01-p1`,moduleNumber:1,number:13,difficulty:`senior-architect`,question:`Your multi-service Node.js + PostgreSQL + React platform is experiencing 1-cent billing discrepancies and occasional cross-account mix-ups on newly migrated 64-bit Snowflake IDs. Diagnose and design the fix end-to-end.`,numberedSteps:[{title:`How to analyze the problem:`,body:"Trace data types across every boundary: DB column type → Node DB driver → JSON serializer → HTTP response → Browser `JSON.parse` → React state. Identify where 64-bit integers exceed `2^53 - 1` and where decimal amounts hit IEEE-754 floats."},{title:`Requirements:`,body:`Zero precision loss for money (multi-currency) and 64-bit IDs; zero downtime during migration; backward compatibility for existing API clients.`},{title:`Architecture:`,body:"Enforce a canonical Domain Boundary Layer in Node.js (converting DB `BIGINT` to string IDs and storing money as integer minor units + ISO-4217 currency code)."},{title:`Database design:`,body:"Store monetary amounts in PostgreSQL as `BIGINT` minor units (or `NUMERIC(19, 4)` for fractional FX rates) alongside `currency CHAR(3)`; keep primary/foreign keys as `BIGINT`."},{title:`API design:`,body:'Return IDs as JSON strings (`"orderId": "728194827193847291"`) and money as structured objects (`{ "amountMinor": 1999, "currency": "USD" }`). Add a short deprecation window if legacy numeric fields exist.'},{title:`Technology choices:`,body:"Configure `pg` driver type parsers (OID 20 for `int8` returns strings by default in `node-postgres`—ensure no unsafe `Number(row.id)` casts exist); use Zod boundary schemas; use integer math or `decimal.js` for FX/tax."},{title:`Scaling:`,body:`Integer minor-unit math is CPU-cheap and avoids object allocation overhead of decimal libraries on high-throughput invoice aggregation.`},{title:`Security:`,body:`Prevent IDOR/cross-account leakage caused by rounded 64-bit IDs colliding; reject non-string IDs and negative/non-integer minor units at API ingress.`},{title:`Failure handling:`,body:"Add reconciliation checks verifying `sum(line_items) === invoice_total` inside DB transactions; fail closed on currency mismatches."},{title:`Trade-offs:`,body:`String IDs slightly increase JSON payload bytes (~2 bytes/ID) vs. numbers, and integer minor units require currency-exponent metadata (e.g., JPY has 0 decimals, USD 2, KWD 3).`},{title:`Sample senior answer:`,body:'"Two foundational JS limits explain both bugs: IEEE-754 binary floats cannot represent base-10 fractions like `0.1` accurately, and `Number` loses integer precision above `2^53 - 1`. I would keep `BIGINT` in Postgres, forbid casting 64-bit IDs to JS `Number` anywhere in the Node/React pipeline by treating IDs as opaque strings in JSON, and migrate billing math to integer minor units paired with currency metadata and DB-level reconciliation assertions."'},{title:`Follow-up questions:`,body:"How do you handle currencies with 3 decimal places (BHD/KWD) or sub-cent ad impressions? Use `NUMERIC(19,4)` in DB and scaled integer micro-units (e.g., 1e-6) or `BigInt` + decimal library for calculation before rounding at settlement."}]},{id:`m01-p1-iq-14`,lessonId:`m01-p1`,moduleNumber:1,number:14,difficulty:`senior-architect`,question:`Design a defensive API validation and transformation pipeline for a high-throughput Node.js gateway handling untrusted nested JSON payloads.`,numberedSteps:[{title:`How to analyze the problem:`,body:"Identify the attack and bug surface of dynamic JS types: oversized payloads, deeply nested JSON causing recursive parser/validator stack overflow, prototype-polluting keys (`__proto__`), and type coercion flaws."},{title:`Requirements:`,body:`Sub-2ms p99 validation overhead at 10k RPS; strict runtime type guarantees; clear 400 validation errors; crash immunity against malformed inputs.`},{title:`Architecture:`,body:`Edge Gateway / Reverse Proxy (size & timeout limits) → Express/Fastify body parser → Compiled Schema Validator (Ajv/Zod) → Pure Domain Normalizer → Service Core.`},{title:`Database design:`,body:'Downstream DB queries receive strictly typed primitives/DTOs only—never raw `req.body` objects (prevents NoSQL operator injection like `{ "$gt": "" }`).'},{title:`API design:`,body:"Strict JSON schemas with `additionalProperties: false`, explicit string max-lengths, integer bounds, and depth limits."},{title:`Technology choices:`,body:`Fastify + Ajv (pre-compiled JSON Schema validators run much faster than dynamic uncompiled checks and keep V8 object shapes predictable/monomorphic).`},{title:`Scaling:`,body:`Pre-compile schemas once at startup rather than per request; keep validation functions stateless and pure for horizontal scaling across worker processes.`},{title:`Security:`,body:"Enforce body byte limit (e.g., 100 KB), iterative depth guard before recursive traversal, strip/reject `__proto__`/`constructor` keys, never use `eval` or loose `==`."},{title:`Failure handling:`,body:"Return structured RFC-9457 / problem-details `400 Bad Request` without leaking internal stack traces; circuit-break or rate-limit repeat offenders."},{title:`Trade-offs:`,body:"Strict schemas (`additionalProperties: false`) catch typos and injection early, at the cost of requiring coordinated API versioning when adding new fields."},{title:`Sample senior answer:`,body:'"Because JavaScript is dynamically typed, internal services shouldn\'t defensively re-check `typeof` everywhere. Instead, I establish a hard trust boundary at the gateway using pre-compiled schemas, bounded payload sizes, and iterative depth checks, producing normalized pure DTOs so downstream business functions operate on guaranteed, monomorphic shapes."'},{title:`Follow-up questions:`,body:`How do you share those runtime type contracts with a React frontend? Generate TypeScript types and client validators from a single OpenAPI or Zod contract package.`}]}],ce=[{id:`m01-p2-iq-1`,lessonId:`m01-p2`,moduleNumber:1,number:1,difficulty:`basic`,question:`What are the four pillars of Object-Oriented Programming (OOP)?`,paragraphs:[{label:`Explanation:`,body:`The four OOP pillars are **Encapsulation** (bundling data and methods together while hiding internal state behind a controlled API), **Abstraction** (exposing only essential behavior while hiding implementation details), **Inheritance** (creating a specialized type that reuses or extends a base type's contract), and **Polymorphism** (allowing different types to respond to the same method or interface in their own way).`}],subboxes:[{title:`Example`,content:"`class LedgerAccount { #balance = 0; deposit(c) { ... } }` (Encapsulation) | `gateway.charge(cents)` across `StripeGateway` and `MockGateway` (Abstraction + Polymorphism)",isCode:!0},{title:`Mnemonic & Tip`,content:`**A-P-I-E** (Abstraction, Polymorphism, Inheritance, Encapsulation). Always pair each pillar with a concrete JavaScript/TypeScript example rather than reciting dictionary definitions.`}]},{id:`m01-p2-iq-2`,lessonId:`m01-p2`,moduleNumber:1,number:2,difficulty:`basic`,question:`What is the difference between shallow copying and deep copying an object or array in JavaScript?`,paragraphs:[{label:`Explanation:`,body:"A **shallow copy** (`{ ...obj }`, `Object.assign({}, obj)`, `[...arr]`, `arr.slice()`) creates a new top-level container, but nested objects and arrays inside it still point to the **same** heap references as the original. Mutating a nested property in the copy mutates the original. A **deep copy** (`structuredClone(obj)` in Node.js v17+ and modern browsers) recursively duplicates nested objects and arrays so changes are completely isolated."}],subboxes:[{title:`Trap`,content:"`JSON.parse(JSON.stringify(obj))` drops `undefined`, functions, `Symbol`, `Map`/`Set`, converts `Date` to strings, and throws on `BigInt` or circular references. `structuredClone` handles circular references, `Date`, `Map`, and `Set`, though it throws on functions and symbols."},{title:`Follow-up & Tip`,content:"React state updates typically use shallow structural sharing (`{ ...user, address: { ...user.address, city } }`) instead of deep-cloning huge trees on every keystroke. Mention `structuredClone` vs. structural sharing trade-offs in interviews."}]},{id:`m01-p2-iq-3`,lessonId:`m01-p2`,moduleNumber:1,number:3,difficulty:`intermediate`,question:"Why is `Object.hasOwn(obj, key)` safer than `key in obj` or `obj.hasOwnProperty(key)`?",paragraphs:[{label:`Explanation:`,body:'The `in` operator checks both the object\'s own properties **and** every object up its prototype chain (so `"toString" in {}` is `true`). Calling `obj.hasOwnProperty(key)` checks only own properties, but fails if the object was created with `Object.create(null)` (no `Object.prototype`) or if an attacker/payload defines a property named `hasOwnProperty`. `Object.hasOwn(obj, key)` (ES2022) safely checks own properties directly as a static method regardless of prototype or property shadowing.'}],subboxes:[{title:`Example`,content:'`Object.hasOwn(Object.create(null), "id")` works safely, whereas `Object.create(null).hasOwnProperty("id")` throws `TypeError`.',isCode:!0},{title:`Interview Tip`,content:"Connect this to dictionary lookups: for dynamic user-supplied keys (like word counts or caches), `new Map()` avoids prototype key collisions entirely."}]},{id:`m01-p2-iq-4`,lessonId:`m01-p2`,moduleNumber:1,number:4,difficulty:`intermediate`,question:"Explain why `[10, 2, 1].sort()` returns `[1, 10, 2]` and mutates the array, and how modern JavaScript fixes both.",paragraphs:[{label:`Explanation:`,body:'By default, `Array.prototype.sort()` converts elements to UTF-16 strings (`"10" < "2"`) and sorts **in place**, mutating the original array. Always supply a numeric comparator `(a, b) => a - b` for numbers. To avoid mutating caller or React state arrays, copy first (`[...arr].sort(cmp)`) or use the ES2023 non-mutating copy-on-write method `arr.toSorted(cmp)`.'}],subboxes:[{title:`Version Note`,content:"`Array.prototype.sort()` stability (preserving relative order of equal keys) has been guaranteed by the ECMAScript spec since **ES2019**. `toSorted()`, `toReversed()`, `toSpliced()`, and `with()` arrived in **ES2023**."},{title:`Follow-up`,content:"When does `(a, b) => a - b` break? If the array contains `Infinity` or `-Infinity`, `Infinity - Infinity` evaluates to `NaN` (not `0`), breaking comparator ordering. Use `(a < b ? -1 : a > b ? 1 : 0)` for extreme floats."}]},{id:`m01-p2-iq-5`,lessonId:`m01-p2`,moduleNumber:1,number:5,difficulty:`advanced`,question:`How do V8 Hidden Classes (Maps) and Array Elements Kinds affect production performance?`,paragraphs:[{label:`Explanation:`,body:"Unlike C++/Java structs with compile-time fixed offsets, JS objects can add/delete properties dynamically. V8 internally assigns objects sharing the same property layout a **Hidden Class (Map)** so property reads compile to fast fixed-offset memory loads (Inline Caches). Adding properties in different orders or conditionally after construction forks Hidden Classes and forces slower polymorphic/megamorphic lookups. Similarly, V8 tracks array **Elements Kinds** (`PACKED_SMI_ELEMENTS` → `PACKED_DOUBLE_ELEMENTS` → `PACKED_ELEMENTS` → `HOLEY_*`). Mixing types or leaving holes (via `delete arr[i]` or `arr[1000] = x`) causes a **one-way** downgrade where missing slots must check `Array.prototype`."}],subboxes:[{title:`Best Practices`,content:"Initialize all object fields in the same order in constructors/factories; keep numeric arrays dense and homogeneous; use `splice`/`filter` instead of `delete arr[i]`."},{title:`Interview Tip`,content:`Clarify that Hidden Classes and Elements Kinds are V8 implementation optimizations, not ECMAScript specification guarantees.`}]},{id:`m01-p2-iq-6`,lessonId:`m01-p2`,moduleNumber:1,number:6,difficulty:`advanced`,question:`How does Prototype Pollution happen in JavaScript object utilities, and how do you defend against it?`,paragraphs:[{label:`Explanation:`,body:'Prototype Pollution occurs when an attacker supplies JSON containing `__proto__`, `constructor`, or `prototype` keys to an unsafe recursive `merge(target, source)` or `setByPath(obj, path, val)` function. Writing `target["__proto__"]["isAdmin"] = true` mutates `Object.prototype`, injecting `isAdmin: true` onto **every** plain object in the Node.js process and potentially bypassing authorization checks or triggering gadget chains.'},{label:`Defenses:`,body:"(1) Explicitly block `__proto__`, `constructor`, and `prototype` keys during merges and path writes; (2) check `Object.hasOwn(source, key)` instead of trusting inherited properties; (3) validate inputs with strict schemas (Zod/Ajv `additionalProperties: false`); (4) store arbitrary user-keyed maps in `new Map()` or `Object.create(null)`."}],subboxes:[{title:`Follow-up`,content:'Does `JSON.parse(\'{"__proto__":{"admin":true}}\')` immediately pollute `Object.prototype`? No—`JSON.parse` creates an own property literally named `"__proto__"`. Pollution happens only when an unsafe recursive merge copies that key via `target[key]`.'},{title:`Interview Tip`,content:"Mention `Object.freeze(Object.prototype)` as a defense-in-depth hardening measure, while noting primary protection must live at input validation and merge helpers."}]},{id:`m01-p2-iq-7`,lessonId:`m01-p2`,moduleNumber:1,number:7,difficulty:`senior-architect`,question:`Design an extensible notification and billing rules engine in Node.js/TypeScript using OOP and SOLID principles without overengineering a rigid inheritance tree.`,numberedSteps:[{title:`How to analyze the problem:`,body:"Identify what changes frequently (new notification channels like Email/SMS/Webhook, new discount/tax rules) versus what stays stable (dispatch orchestration, audit logging, retry/idempotency). Avoid deep inheritance chains like `RetryableAsyncEmailNotifier extends AsyncNotifier extends BaseNotifier`."},{title:`Requirements:`,body:`Support multiple channels and pricing rules; add new channels without editing existing core dispatcher code (OCP); enforce encapsulated domain invariants (non-negative totals); safe against untrusted rule payloads.`},{title:`Architecture:`,body:"Use **Composition + Strategy Pattern** aligned with SOLID: a thin `NotificationService` (SRP) depends on a small `NotificationChannel` interface (ISP/DIP) and composes independent `Channel` implementations plus a `RetryPolicy`."},{title:`Database design:`,body:"Store `notifications` (`id`, `channel`, `recipient`, `payload_json`, `status`, `attempts`, `idempotency_key`) and `pricing_rules` (`id`, `rule_type`, `config_json`, `priority`) in PostgreSQL."},{title:`API design:`,body:"Expose typed DTO boundaries (`POST /notifications/send`, `POST /invoices/quote`) validated against strict schemas before instantiating domain objects."},{title:`Technology choices:`,body:"TypeScript interfaces for contracts (`NotificationChannel`, `DiscountRule`), ES2022 `#private` fields inside domain entities (e.g., `Invoice` protecting `#lineItems` and `#totalCents`), and a `Map<string, NotificationChannel>` registry instead of a growing `switch` statement."},{title:`Scaling:`,body:`Keep channel strategy instances stateless so workers scale horizontally behind a queue (BullMQ/SQS) without shared mutable state.`},{title:`Security:`,body:"Protect config hydration from Prototype Pollution by explicitly blocking `__proto__`, `constructor`, and `prototype` keys alongside `Object.hasOwn` (since `JSON.parse` creates `__proto__` as an own property), using `Map` lookup for channel names instead of `channels[userInput]`, and hiding internal secrets with `#private` fields and explicit `toJSON()` serializers."},{title:`Failure handling:`,body:"Liskov Substitution (LSP): every `NotificationChannel` implementation honors the same result contract (`{ sent: true } | { sent: false, retryable: boolean }`) rather than some throwing raw HTTP errors and others returning `false`."},{title:`Trade-offs:`,body:"Composition + small interfaces add a tiny bit of wiring boilerplate vs. a single `if/else` function, so apply Strategy/DIP only at genuine extension axes (channels/rules), not for one-off helpers (avoid YAGNI violations)."},{title:`Sample senior answer:`,body:'"Instead of modeling channels with deep inheritance, I compose small, single-responsibility capabilities around narrow interfaces. `NotificationService` depends on a `NotificationChannel` abstraction (DIP) looked up via a `Map` registry, so adding WhatsApp or Slack later requires zero edits to core dispatch logic (OCP). Domain objects like `Invoice` use `#private` fields to enforce invariants, and every channel honors a uniform return contract (LSP) so retry middleware handles failures predictably."'},{title:`Follow-up questions:`,body:"When would you refactor a simple `switch` into Strategy + DIP? Only when at least 2–3 concrete variants exist or external plugins/teams own separate implementations."}]},{id:`m01-p2-iq-8`,lessonId:`m01-p2`,moduleNumber:1,number:8,difficulty:`basic`,question:"How do ES2015+ classes and ES2022 `#private` fields differ from plain objects and TypeScript's `private` keyword?",paragraphs:[{label:`Explanation:`,body:"A `class` attaches shared methods once on `ClassName.prototype`, runs its body in strict mode automatically, and throws a `TypeError` if invoked without `new`. TypeScript's `private` keyword is erased at compile time—compiled JavaScript still stores a normal public property that external code or `JSON.stringify` can read. By contrast, ES2022 `#private` fields and methods are enforced at **runtime** by the JavaScript engine: external access (`obj.#secret`) fails at parse time with a `SyntaxError`, and private slots are excluded from `Object.keys()` and `JSON.stringify()`."}],subboxes:[{title:`Example`,content:"`class Vault { #token; constructor(t) { this.#token = t; } }` — `Object.keys(new Vault('x'))` is `[]`, and `v.#token` outside is a `SyntaxError`.",isCode:!0},{title:`Interview Tip`,content:"Also note that subclasses cannot access a parent class's `#private` fields directly; expose a controlled public method or getter when subclass cooperation is intended."}]},{id:`m01-p2-iq-9`,lessonId:`m01-p2`,moduleNumber:1,number:9,difficulty:`intermediate`,question:"When should you use class inheritance (`extends`) versus composition, and how does the Liskov Substitution Principle (LSP) catch bad hierarchies?",paragraphs:[{label:`Explanation:`,body:'Use `extends` only for shallow, genuine **"is-a"** taxonomies (for example, `RateLimitError extends AppError` where every `RateLimitError` truly is an `AppError`). For sharing capabilities across services—like retries, logging, or payment gateways—use **composition** ("has-a") by injecting small collaborators into the constructor, because JavaScript only supports single inheritance and deep `extends` chains couple subclasses tightly to parent internals (**Fragile Base Class**).'},{label:`LSP Check:`,body:"The **Liskov Substitution Principle** states that any subclass or strategy must be safely usable wherever the base type is expected. Classic violation: `Square extends Rectangle` breaks callers assuming `rect.setWidth(5); rect.setHeight(4)` yields area `20`, or a subclass throws `NotImplementedError` on an inherited method."}],subboxes:[{title:`Example`,content:"`class RateLimitError extends AppError` preserves `toClientPayload()` shape while adding `retryAfterSec` via `super.toClientPayload()`.",isCode:!0},{title:`Follow-up & Tip`,content:"In TypeScript/Node.js backends, prefer small interfaces (`PaymentGateway`, `Clock`) + constructor injection (DIP) over base classes like `BaseService`."}]}];function le(e){return e.toLowerCase().replace(/[^a-z0-9]+/g,`-`).replace(/^-+|-+$/g,``)}function ue(e,t){return t.map((t,n)=>typeof t==`string`?{id:`m${String(e).padStart(2,`0`)}-t${n+1}-${le(t)}`,moduleNumber:e,title:t,status:`unwritten`}:Array.isArray(t)?{id:`m${String(e).padStart(2,`0`)}-t${n+1}-${le(t[1])}`,moduleNumber:e,group:t[0],title:t[1],status:`unwritten`}:{id:`m${String(e).padStart(2,`0`)}-t${n+1}-${le(t.title)}`,moduleNumber:e,group:t.group,title:t.title,status:`available`,lessonId:t.lessonId,anchorId:t.anchorId})}function T(e,t,n,r,i){return{number:e,title:t,category:n,topics:ue(e,r),notes:i}}var de=[T(1,`Programming Fundamentals & JavaScript`,`fundamentals`,[{title:`Programming fundamentals`,lessonId:`m01-p1`,anchorId:`m01-p1-topic-fundamentals`},{title:`Variables`,lessonId:`m01-p1`,anchorId:`m01-p1-topic-variables`},{title:`Data types`,lessonId:`m01-p1`,anchorId:`m01-p1-topic-data-types`},{title:`Functions`,lessonId:`m01-p1`,anchorId:`m01-p1-topic-functions`},{title:`Objects`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-objects`},{title:`Arrays`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-arrays`},{title:`Classes`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-classes`},{title:`OOP`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-oop`},{title:`Encapsulation`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-encapsulation`},{title:`Inheritance`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-inheritance`},{title:`Polymorphism`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-polymorphism`},{title:`Abstraction`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-abstraction`},{title:`SOLID fundamentals`,lessonId:`m01-p2`,anchorId:`m01-p2-topic-solid`},`Algorithms`,`Data structures`,`Time complexity`,`Space complexity`,`Big O`,`Recursion`,`Sorting`,`Searching`,`Hash maps`,`Stacks`,`Queues`,`Trees`,`Graph fundamentals`,`JavaScript`,`ES6+`,`Closures`,`Scope`,`Hoisting`,`Prototype`,`Prototypal inheritance`,`this`,`Arrow functions`,`Promises`,`Async/await`,`Event loop`,`Microtasks`,`Macrotasks`,`Mem
